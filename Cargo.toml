serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "1.0"
rhai = { version = "1.24", features = ["sync"] }
rapier3d = "0.32.0"
raw-window-handle = "0.6"
winit = "0.30"
wgpu = "29.0"
crossterm = "0.28"
ratatui = "0.29"
notify = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
gltf = "1.4"
fontdue = "0.9.3"
cpal = "0.15"
