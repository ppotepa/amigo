[workspace]
resolver = "2"
default-members = ["crates/apps/launcher"]
members = [
    "crates/foundation/core",
    "crates/foundation/math",
    "crates/foundation/fx",
    "crates/engine/runtime",
    "crates/engine/assets",
    "crates/engine/font",
    "crates/engine/hot-reload",
    "crates/engine/capabilities",
    "crates/engine/scene",
    "crates/engine/state",
    "crates/engine/input-actions",
    "crates/engine/behavior",
    "crates/engine/event-pipeline",
    "crates/engine/modding",
    "crates/engine/devtools",
    "crates/engine/camera",
    "crates/engine/runtime-control",
    "crates/engine/editor-api",
    "crates/engine/editor-session",
    "crates/engine/editor-authoring",
    "crates/engine/editor-ingame",
    "crates/engine/render-api",
    "crates/engine/render-wgpu",
    "crates/engine/session",
    "crates/platform/window-api",
    "crates/platform/window-winit",
    "crates/platform/file-watch-api",
    "crates/platform/file-watch-notify",
    "crates/platform/input-api",
    "crates/platform/input-winit",
    "crates/scripting/api",
    "crates/scripting/rhai",
    "crates/2d/sprite",
    "crates/2d/layered-image",
    "crates/2d/depth-map",
    "crates/2d/lighting",
    "crates/2d/composition",
    "crates/2d/spatial",
    "crates/2d/post-fx",
    "crates/2d/text",
    "crates/2d/vector",
    "crates/2d/lighting/beacon",
    "crates/2d/physics",
    "crates/2d/tilemap",
    "crates/2d/motion",
    "crates/2d/particles",
    "crates/3d/mesh",
    "crates/3d/text",
    "crates/3d/material",
    "crates/audio/api",
    "crates/audio/generated",
    "crates/audio/mixer",
    "crates/audio/output",
    "crates/ui/core",
    "crates/ui/layout",
    "crates/runtime/bundles",
    "crates/apps/app",
    "crates/tools/scene-preview",
    "crates/tools/scene-snapshot",
    "crates/tools/amigo-codemap",
    "crates/tools/amigo-symbol-explorer",
    "crates/apps/launcher",
    "crates/platform/app-host-api",
    "crates/platform/app-host-winit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Amigo Engine Team"]

[workspace.dependencies]
amigo-core = { path = "crates/foundation/core" }
amigo-math = { path = "crates/foundation/math" }
amigo-fx = { path = "crates/foundation/fx" }
amigo-runtime = { path = "crates/engine/runtime" }
camino = "1.1"
glam = "0.30"
amigo-session = { path = "crates/engine/session" }
amigo-capabilities = { path = "crates/engine/capabilities" }
amigo-assets = { path = "crates/engine/assets" }
amigo-font = { path = "crates/engine/font" }
amigo-hot-reload = { path = "crates/engine/hot-reload" }
amigo-scene = { path = "crates/engine/scene" }
amigo-state = { path = "crates/engine/state" }
amigo-input-actions = { path = "crates/engine/input-actions" }
amigo-behavior = { path = "crates/engine/behavior" }
amigo-event-pipeline = { path = "crates/engine/event-pipeline" }
amigo-modding = { path = "crates/engine/modding" }
amigo-devtools = { path = "crates/engine/devtools" }
amigo-camera = { path = "crates/engine/camera" }
amigo-runtime-control = { path = "crates/engine/runtime-control" }
amigo-editor-api = { path = "crates/engine/editor-api" }
amigo-editor-session = { path = "crates/engine/editor-session" }
amigo-editor-authoring = { path = "crates/engine/editor-authoring" }
amigo-editor-ingame = { path = "crates/engine/editor-ingame" }
amigo-render-api = { path = "crates/engine/render-api" }
amigo-render-wgpu = { path = "crates/engine/render-wgpu" }
amigo-window-api = { path = "crates/platform/window-api" }
amigo-window-winit = { path = "crates/platform/window-winit" }
amigo-file-watch-api = { path = "crates/platform/file-watch-api" }
amigo-file-watch-notify = { path = "crates/platform/file-watch-notify" }
amigo-input-api = { path = "crates/platform/input-api" }
amigo-input-winit = { path = "crates/platform/input-winit" }
amigo-app-host-api = { path = "crates/platform/app-host-api" }
amigo-app-host-winit = { path = "crates/platform/app-host-winit" }
amigo-scripting-api = { path = "crates/scripting/api" }
amigo-scripting-rhai = { path = "crates/scripting/rhai" }
amigo-2d-sprite = { path = "crates/2d/sprite" }
amigo-2d-layered-image = { path = "crates/2d/layered-image" }
amigo-2d-depth-map = { path = "crates/2d/depth-map" }
amigo-2d-lighting = { path = "crates/2d/lighting" }
amigo-2d-composition = { path = "crates/2d/composition" }
amigo-2d-spatial = { path = "crates/2d/spatial" }
amigo-2d-post-fx = { path = "crates/2d/post-fx" }
amigo-2d-text = { path = "crates/2d/text" }
amigo-2d-vector = { path = "crates/2d/vector" }
amigo-2d-lighting-beacon = { path = "crates/2d/lighting/beacon" }
amigo-2d-physics = { path = "crates/2d/physics" }
amigo-2d-tilemap = { path = "crates/2d/tilemap" }
amigo-2d-motion = { path = "crates/2d/motion" }
amigo-2d-particles = { path = "crates/2d/particles" }
amigo-3d-mesh = { path = "crates/3d/mesh" }
amigo-3d-text = { path = "crates/3d/text" }
amigo-3d-material = { path = "crates/3d/material" }
amigo-audio-api = { path = "crates/audio/api" }
amigo-audio-generated = { path = "crates/audio/generated" }
amigo-audio-mixer = { path = "crates/audio/mixer" }
amigo-audio-output = { path = "crates/audio/output" }
amigo-ui = { path = "crates/ui/core" }
amigo-ui-layout = { path = "crates/ui/layout" }
amigo-runtime-bundles = { path = "crates/runtime/bundles" }
amigo-app = { path = "crates/apps/app" }
amigo-symbol-explorer = { path = "crates/tools/amigo-symbol-explorer" }

serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "1.0"
rhai = { version = "1.24", features = ["sync"] }
raw-window-handle = "0.6"
winit = "0.30"
wgpu = "29.0"
crossterm = "0.28"
ratatui = "0.29"
notify = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
fontdue = "0.9.3"
cpal = "0.15"
