[workspace]
resolver = "2"
default-members = ["crates/apps/launcher"]
members = [
    "crates/core/codemap-api",
    "crates/core/plugin-api",
    "crates/core/plugin-index",
    "crates/core/plugin-loader",
    "crates/core/plugin-manifest",
    "crates/foundation/core",
    "crates/foundation/math",
    "crates/foundation/fx",
    "crates/engine/runtime",
    "crates/engine/assets",
    "crates/engine/font",
    "crates/engine/hot-reload",
    "crates/engine/capabilities",
    "crates/engine/camera",
    "crates/engine/scene",
    "crates/engine/state",
    "crates/engine/input-actions",
    "crates/engine/event-pipeline",
    "crates/engine/modding",
    "crates/engine/devtools",
    "crates/engine/runtime-control",
    "crates/engine/editor-api",
    "crates/engine/editor-session",
    "crates/engine/editor-authoring",
    "crates/engine/editor-ingame",
    "crates/engine/render-api",
    "crates/engine/overlay-api",
    "crates/engine/render-wgpu",
    "crates/engine/session",
    "crates/platform/window-api",
    "crates/platform/window-winit",
    "crates/platform/file-watch-api",
    "crates/platform/file-watch-notify",
    "crates/platform/input-api",
    "crates/platform/input-winit",
    "crates/scripting/api",
    "crates/scripting/rhai",
    "crates/2d/composition",
    "crates/2d/material-api",
    "crates/2d/spatial",
    "crates/2d/physics",
    "crates/3d/physics",
    "crates/3d/mesh",
    "crates/3d/text",
    "crates/3d/material",
    "crates/audio/api",
    "crates/audio/generated",
    "crates/audio/mixer",
    "crates/audio/output",
    "crates/ui/core",
    "crates/ui/layout",
    "crates/runtime/bundles",
    "crates/apps/app",
    "crates/tools/scene-preview",
    "crates/tools/scene-snapshot",
    "crates/tools/amigo-codemap",
    "crates/tools/amigo-symbol-explorer",
    "crates/tools/plugin-check",
    "crates/tools/plugin-new",
    "crates/apps/launcher",
    "crates/platform/app-host-api",
    "crates/platform/app-host-winit",
    "plugins/camera/camera-core",
    "plugins/camera/camera-optics",
    "plugins/camera/focus-depth",
    "plugins/camera/shutter-motion",
    "plugins/camera/film-look",
    "plugins/camera/camera-profiles",
    "plugins/devtools/codemap",
    "plugins/gfx/sprite-2d",
    "plugins/gfx/text-2d",
    "plugins/gfx/vector-2d",
    "plugins/gfx/layered-image-2d",
    "plugins/gfx/tilemap-2d",
    "plugins/lighting/light-2d",
    "plugins/lighting/light-groups-2d",
    "plugins/lighting/lightmaps-2d",
    "plugins/lighting/beacon-light-2d",
    "plugins/lighting/relight-2d",
    "plugins/materials/material-2d",
    "plugins/materials/material-maps",
    "plugins/materials/procedural-materials",
    "plugins/vfx/particles-2d",
    "plugins/vfx/trails-2d",
    "plugins/postfx/bloom",
    "plugins/postfx/color-grading",
    "plugins/postfx/scopes",
    "plugins/postfx/composite",
    "plugins/postfx/debug-views",
    "plugins/gameplay/behavior",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Amigo Engine Team"]

[workspace.dependencies]
amigo-core = { path = "crates/foundation/core" }
amigo-plugin-api = { path = "crates/core/plugin-api" }
amigo-math = { path = "crates/foundation/math" }
amigo-fx = { path = "crates/foundation/fx" }
amigo-runtime = { path = "crates/engine/runtime" }
camino = "1.1"
glam = "0.30"
amigo-session = { path = "crates/engine/session" }
