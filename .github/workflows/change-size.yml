name: change-size

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce review size budget
        uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const changedFiles = files.length;
            const additions = files.reduce((sum, file) => sum + file.additions, 0);
            const deletions = files.reduce((sum, file) => sum + file.deletions, 0);
            const changedLines = additions + deletions;

            core.info(`review size: ${changedFiles} files, ${additions} additions, ${deletions} deletions`);
            if (changedFiles > 200 || changedLines > 50000) {
              core.setFailed(
                `Change exceeds review budget: ${changedFiles} files / ${changedLines} changed lines. ` +
                `Split the work into independently reviewable changes or document an explicit exception.`
              );
            }
