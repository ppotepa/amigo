name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Validate plugin contracts
        run: cargo run -p amigo-plugin-check -- validate --workspace --plugins plugins

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Clippy critical crates
        run: >-
          cargo clippy
          -p amigo-runtime
          -p amigo-plugin-api
          -p amigo-plugin-index
          -p amigo-plugin-loader
          -p amigo-render-api
          -p amigo-scripting-rhai
          --all-targets -- -D warnings

      - name: Contract tests
        run: >-
          cargo test
          -p amigo-plugin-api
          -p amigo-plugin-index
          -p amigo-plugin-loader
          -p amigo-render-api
          -p amigo-scripting-rhai
