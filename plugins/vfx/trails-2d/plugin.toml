id = "amigo.vfx.trails-2d"
family = "vfx"
kind = "renderable-source"
renderable = true
render_participation = "source-renderer"

[capabilities]
provides = ["vfx.trails.2d@1"]
requires = []

[slots]
implements = []
requires = []
replaces = []

[targets]
reads = []
writes = ["SceneColor", "SceneAlpha"]
contributes = ["SceneHighlight", "SceneEmissive", "SceneVelocity"]

[contributions]
emits = [
  { domain = "camera.optics", type = "CameraOpticsContribution2d", policy = "ExplicitOnly" },
  { domain = "camera.shutter_motion", type = "MotionShutterContribution2d", policy = "DisabledByDefault" }
]
consumes = []

[diagnostics]
channels = ["trails-2d.render", "trails-2d.contributions"]

[docs]
pipeline = "docs/pipeline.md"
contributions = "docs/contributions.md"
diagnostics = "docs/diagnostics.md"

[tests]
waterfall = "tests/waterfall_tests.rs"
diagnostics = "tests/diagnostics_tests.rs"
