id = "amigo.lighting.light-2d"
family = "lighting"
kind = "semantic-source"
renderable = false
render_participation = "none"

[capabilities]
provides = ["lighting.light.2d@1"]
requires = []

[slots]
implements = []
requires = []
replaces = []

[targets]
reads = []
writes = ["SceneLighting"]
contributes = ["SceneHighlight", "SceneEmissive"]

[contributions]
emits = [
  { domain = "camera.optics", type = "CameraOpticsContribution2d", policy = "ExplicitOnly" }
]
consumes = []

[diagnostics]
channels = ["light-2d.contributions"]

[docs]
pipeline = "docs/pipeline.md"
contributions = "docs/contributions.md"
diagnostics = "docs/diagnostics.md"

[tests]
waterfall = "tests/waterfall_tests.rs"
diagnostics = "tests/diagnostics_tests.rs"
