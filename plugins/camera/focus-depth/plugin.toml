id = "amigo.camera.focus-depth"
family = "camera"
kind = "target-consumer"
renderable = false
render_participation = "target-consumer"

[capabilities]
provides = ["camera.focus_depth.2d@1"]
requires = ["camera.frame_context.2d@1"]

[slots]
implements = ["camera.focus_model.2d"]
requires = ["camera.frame_provider.2d"]
replaces = []

[targets]
reads = ["SceneDepth", "SceneColor"]
writes = ["SceneColor"]
contributes = []

[contributions]
emits = []
consumes = [
  { domain = "camera.focus_depth", type = "FocusDepthContribution2d", policy = "DerivedAtHydration" }
]

[diagnostics]
channels = ["focus-depth.candidates"]

[docs]
pipeline = "docs/pipeline.md"
contributions = "docs/contributions.md"
diagnostics = "docs/diagnostics.md"

[tests]
waterfall = "tests/waterfall_tests.rs"
diagnostics = "tests/diagnostics_tests.rs"
