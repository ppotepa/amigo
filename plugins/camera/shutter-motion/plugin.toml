id = "amigo.camera.shutter-motion"
family = "camera"
kind = "target-consumer"
renderable = false
render_participation = "target-consumer"

[capabilities]
provides = ["camera.shutter_motion.2d@1"]
requires = ["camera.frame_context.2d@1"]

[slots]
implements = ["camera.shutter_model.2d"]
requires = ["camera.frame_provider.2d"]
replaces = []

[targets]
reads = ["SceneVelocity", "SceneColor"]
writes = ["SceneColor"]
contributes = []

[contributions]
emits = []
consumes = [
  { domain = "camera.shutter_motion", type = "MotionShutterContribution2d", policy = "DisabledByDefault" }
]

[diagnostics]
channels = ["shutter-motion.candidates"]

[docs]
pipeline = "docs/pipeline.md"
contributions = "docs/contributions.md"
diagnostics = "docs/diagnostics.md"

[tests]
waterfall = "tests/waterfall_tests.rs"
diagnostics = "tests/diagnostics_tests.rs"
