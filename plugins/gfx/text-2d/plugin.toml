id = "amigo.gfx.text-2d"
family = "gfx"
kind = "renderable-source"
renderable = true
render_participation = "source-renderer"

[capabilities]
provides = ["gfx.text.2d@1"]
requires = []

[slots]
implements = []
requires = []
replaces = []

[targets]
reads = []
writes = ["SceneColor", "SceneAlpha"]
contributes = ["SceneHighlight", "SceneDepth"]

[contributions]
emits = [
  { domain = "camera.optics", type = "CameraOpticsContribution2d", policy = "ExplicitOnly" },
  { domain = "camera.focus_depth", type = "FocusDepthContribution2d", policy = "DerivedAtHydration" }
]
consumes = []

[diagnostics]
channels = [
  "text-2d.render",
  "text-2d.contributions"
]

[docs]
pipeline = "docs/pipeline.md"
contributions = "docs/contributions.md"
diagnostics = "docs/diagnostics.md"

[tests]
waterfall = "tests/waterfall_tests.rs"
diagnostics = "tests/diagnostics_tests.rs"
