[workspace]

[package]
name = "char-3d-rust-impl"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
anyhow = "1"
bytemuck = { version = "1.24", features = ["derive"] }
egui = "0.34.2"
egui-wgpu = { version = "0.34.2", features = ["winit"] }
egui-winit = "0.34.2"
glam = "0.30"
flate2 = "1.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "0.4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "29.0.1"
winit = "0.30.13"
