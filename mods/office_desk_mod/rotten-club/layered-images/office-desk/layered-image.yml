kind: layered-image-2d
schema_version: 1

# Unique identifier for this layered image.  Other scene files will
# reference this ID when loading the base plate.  Keep IDs
# consistent and descriptive.
id: office-desk
label: Office Desk
description: |-
  A static office desk scene with 1990s decor.  This layered image
  consists of a single base plate.  Additional lighting and
  post‑processing is handled via visual maps and beacons rather than
  layered artwork.

# Size of the canvas in pixels.  All visual maps and depth maps must
# match this resolution.  This MVP keeps the original HTML mockup
# plate size so exported maps stay pixel-aligned.
canvas:
  width: 1672
  height: 941

# Base plate definition.  Only a single image is used here because
# dynamic lighting is supplied via the depth map and beacon lights.
base:
  image: base_albedo.png

# No additional art layers.  MVP lighting is supplied by BeaconLight2D
# rather than direct material/emissive map binding.
layers: []

# Thumbnail or preview used in launchers and menus.  Re‑using the
# plate itself suffices here.
preview:
  image: base_albedo.png
