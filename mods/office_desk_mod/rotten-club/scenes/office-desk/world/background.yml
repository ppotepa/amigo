kind: scene-fragment
schema_version: 1

# Defines the static background entity for the office desk scene.  The
# LayeredImage2D component draws the base plate. Technical maps from
# the HTML mockup are kept as assets, but MVP runtime lighting is
# driven by camera DOF and BeaconLight2D, not direct material maps.

entities:
  - id: office-desk-background
    name: office desk background
    tags:
      - office-desk
      - background
      - plate
    visible: true
    simulation_enabled: false
    collision_enabled: false
    transform2:
      translation: { x: 0.0, y: 0.0 }
      rotation_degrees: 0.0
      scale: { x: 1.0, y: 1.0 }
    components:
      - type: LayeredImage2D
        render_layer: background.room
        asset: rotten-club/layered-images/office-desk
        size:
          x: 1672.0
          y: 941.0
        base_opacity: 1.0
        # Fit the image to cover the viewport while preserving aspect
        # ratio.  If the viewport is wider than 16:9 the sides will
        # be cropped; if it is taller, the top and bottom will be
        # cropped.
        viewport_fit: cover
        z_index: -100.0
