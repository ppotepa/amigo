kind: scene-fragment
schema_version: 1

# Defines the order and behaviour of render layers for the office
# desk scene.  Layers with lower order values draw earlier.  The
# depth mode selects how the renderer interprets depth for each
# layer.

visual2d:
  spatial:
    # Configure a logarithmic depth space.  Objects closer than
    # 0.5 metres will appear extremely close, while objects farther
    # than 120 metres are considered at infinity.  This range is
    # intentionally broad because our plate is essentially flat.
    depth_space:
      near_m: 0.5
      far_m: 120.0
      curve: logarithmic

  render_layers:
    # Base layer for the office room plate.  This draws the
    # layered image and binds the depth map.  Because we attach a
    # depth map to this layer, DOF and other post‑processing can
    # sample from it.
    - id: background.room
      label: Background Room
      order: -100.0
      visible: true
      opacity: 1.0
      optical_role: world_surface
      depth:
        mode: depth_map

    # Beacon lights are drawn after the base plate but before any
    # potential foreground elements.  They use distance depth rather
    # than the depth map because they are separate sprites.
    - id: lighting.beacons
      label: Lighting Beacons
      order: -10.0
      visible: true
      opacity: 0.0
      optical_role: scene_medium
      depth:
        mode: distance
        distance_m: 8.0
        blur_scale: 0.2

    # Overlay layer reserved for UI.  At the moment the office
    # desk scene has no custom UI, but leaving this layer in place
    # prevents overlay elements from being occluded by world
    # content.  It uses overlay depth mode to always appear on top.
    - id: ui.overlay
      label: UI Overlay
      order: 1000.0
      visible: true
      opacity: 1.0
      optical_role: overlay
      depth:
        mode: overlay
