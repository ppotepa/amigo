id: "npr"
title: "NPR · Pracownia"
preset_name_bind: "world.npr.settings.NprSettings.preset_name"
preset_domain_bind: "world.npr.settings.NprSettings.preset_domain"
confirm_actions:
  - "overwrite"
  - "reset"
  - "layout-grid"
presentation:
  style-preset:
    reset: false
    choices:
      - {value: Comic Ink, label: Comic Ink, artwork: Comic Ink}
      - {value: Pencil Study, label: Pencil Study, artwork: Comic Ink}
      - {value: Loose Study, label: Loose Study, artwork: Comic Ink}
      - {value: Confident Ink, label: Confident Ink, artwork: Comic Ink}
      - {value: Broad Nib, label: Broad Nib, artwork: Comic Ink}
      - {value: Blueprint, label: Blueprint, artwork: Blueprint}
      - {value: Soft Toon, label: Soft Toon, artwork: Soft Toon}
  browser:
    pin: "top"
  playback:
    pin: "top"
  footer:
    pin: "bottom"
  advanced:
    collapsed: true
  selected:
    navigation: true
    tooltip: "Wybierz obiekt sceny. W trybie pojedynczym kamera dopasuje kadr."
    choices:
      -
        value: "cube"
        label: "Sześcian"
        artwork_bind: "world.npr.settings.NprSettings.objects.cube.model"
        status_bind: "world.npr.settings.NprSettings.objects.cube.status"
      -
        value: "wedge"
        label: "Klin"
        artwork_bind: "world.npr.settings.NprSettings.objects.wedge.model"
        status_bind: "world.npr.settings.NprSettings.objects.wedge.status"
      -
        value: "cylinder"
        label: "Walec"
        artwork_bind: "world.npr.settings.NprSettings.objects.cylinder.model"
        status_bind: "world.npr.settings.NprSettings.objects.cylinder.status"
      -
        value: "sphere"
        label: "Sfera"
        artwork_bind: "world.npr.settings.NprSettings.objects.sphere.model"
        status_bind: "world.npr.settings.NprSettings.objects.sphere.status"
      -
        value: "suzanne"
        label: "Suzanne"
        artwork_bind: "world.npr.settings.NprSettings.objects.suzanne.model"
        status_bind: "world.npr.settings.NprSettings.objects.suzanne.status"
      -
        value: "avocado"
        label: "Awokado"
        artwork_bind: "world.npr.settings.NprSettings.objects.avocado.model"
        status_bind: "world.npr.settings.NprSettings.objects.avocado.status"
  object-override:
    tooltip: "Włącz, aby skopiować styl sceny i edytować go niezależnie."
  object-angular-speed:
    suffix: " °/s"
  object-rotation:
    suffix: " °"
  camera-yaw:
    suffix: " °"
  camera-pitch:
    suffix: " °"
  camera-fov:
    suffix: " °"
  ink-crease_angle:
    suffix: " °"
  ink-smooth_crease_angle:
    suffix: " °"
  ink-outline_width:
    suffix: " px"
  ink-crease_width:
    suffix: " px"
  ink-min_crease_length_pixels:
    suffix: " px"
  ink-boundary_width:
    suffix: " px"
  ink-wobble:
    suffix: " px"
root:
  type: "column"
  id: "root"
  children:
    -
      type: "column"
      id: "browser"
      enabled_bind: "world.npr.settings.NprSettings.editable"
      children:
        -
          type: "option-set"
          id: "selected"
          text: "Obiekty sceny"
          value_bind: "world.npr.settings.NprSettings.selected"
          options:
            - "cube"
            - "wedge"
            - "cylinder"
            - "sphere"
            - "suzanne"
            - "avocado"
        -
          type: "row"
          id: "browser-actions"
          children:
            -
              type: "button"
              id: "previous-object"
              text: "← Poprzedni"
              enabled_bind: "world.npr.settings.NprSettings.can_select_previous_object"
              on_click:
                event: "npr.select_previous_object"
            -
              type: "button"
              id: "next-object"
              text: "Następny →"
              enabled_bind: "world.npr.settings.NprSettings.can_select_next_object"
              on_click:
                event: "npr.select_next_object"
            -
              type: "toggle"
              id: "gallery"
              text: "Wszystkie obiekty"
              value_bind: "world.npr.settings.NprSettings.gallery"
            -
              type: "button"
              id: "focus-selected"
              text: "Pokaż tylko wybrany"
              on_click:
                event: "npr.focus_selected"
        -
          type: "text"
          id: "badges"
          text: "W: na ekranie · R: obrót · S: własny styl"
    -
      type: "column"
      id: "playback"
      enabled_bind: "world.npr.settings.NprSettings.editable"
      children:
        -
          type: "row"
          id: "transport"
          children:
            -
              type: "toggle"
              id: "paused"
              text: "Pauza"
              value_bind: "world.npr.settings.NprSettings.paused"
            -
              type: "button"
              id: "step"
              text: "Krok 1/60 s"
              on_click:
                event: "npr.step"
              enabled_bind: "world.npr.settings.NprSettings.paused"
            -
              type: "button"
              id: "undo"
              text: "Cofnij"
              on_click:
                event: "npr.undo"
              enabled_bind: "world.npr.settings.NprSettings.can_undo"
            -
              type: "button"
              id: "redo"
              text: "Ponów"
              on_click:
                event: "npr.redo"
              enabled_bind: "world.npr.settings.NprSettings.can_redo"
        -
          type: "column"
          id: "speed-row"
          children:
            -
              type: "slider"
              id: "speed"
              text: "Tempo animacji"
              value_bind: "world.npr.settings.NprSettings.speed"
              min: 0
              max: 4
              step: 0.05
            - type: row
              id: speed-presets
              children:
                - type: button
                  id: speed-half
                  text: "½×"
                  on_click: {event: npr.speed_half}
                - type: button
                  id: speed-normal
                  text: "1×"
                  on_click: {event: npr.speed_normal}
                - type: button
                  id: speed-double
                  text: "2×"
                  on_click: {event: npr.speed_double}
        -
          type: "slider"
          id: "appearance-fade-seconds"
          text: "Pojawianie nowych kresek"
          tooltip: "0 s wyłącza łagodne pojawianie się nowych linii. Obrót modelu i kamera działają niezależnie, a istniejący charakter kreski pozostaje stabilny."
          value_bind: "world.npr.settings.NprSettings.motion.appearance_fade_seconds"
          min: 0
          max: 2
          step: 0.01
        -
          type: "option-set"
          id: "stroke-motion-mode"
          text: "Kreski podczas ruchu"
          tooltip: "Stabilne zachowują ten sam wariant gestu podczas obrotu i pracy kamery. Przerysowuj zmienia wariant tylko po rzeczywistym ruchu kotwic powierzchni, z ograniczoną częstotliwością."
          value_bind: "world.npr.settings.NprSettings.motion.mode"
          options:
            - "stable"
            - "redraw-on-motion"
        -
          type: "slider"
          id: "stroke-redraw-hz"
          text: "Częstotliwość przerysowania"
          tooltip: "Maksymalna liczba zmian wariantu gestu na sekundę podczas aktywnego ruchu; niezależna od FPS."
          value_bind: "world.npr.settings.NprSettings.motion.redraw_hz"
          enabled_bind: "world.npr.settings.NprSettings.motion_redraw_editable"
          min: 0.25
          max: 20
          step: 0.25
        -
          type: "slider"
          id: "stroke-redraw-strength"
          text: "Siła przerysowania"
          tooltip: "0 zachowuje stabilny seed; 1 wybiera pełny nowy wariant gestu."
          value_bind: "world.npr.settings.NprSettings.motion.redraw_strength"
          enabled_bind: "world.npr.settings.NprSettings.motion_redraw_editable"
          min: 0
          max: 1
          step: 0.01
        -
          type: "button"
          id: "new-gesture-variant"
          text: "Nowy wariant gestu"
          tooltip: "Jednorazowo zmienia wariant rysunkowy wybranego obiektu. Nie zmienia geometrii, kotwic ani ruchu kamery."
          on_click: {event: npr.new_gesture_variant}
    -
      type: "tab-view"
      id: "workspace"
      tabs:
        -
          id: "appearance"
          label: "Wygląd"
        -
          id: "object"
          label: "Obiekt"
        -
          id: "scene"
          label: "Scena"
        -
          id: "camera"
          label: "Kamera"
        -
          id: "presets"
          label: "Presety"
        -
          id: "diagnostics"
          label: "Diagnostyka"
      children:
        -
          type: "column"
          id: "appearance"
          children:
            -
              type: "option-set"
              id: "style-scope"
              text: "Zakres edycji"
              value_bind: "world.npr.settings.NprSettings.style_scope"
              options:
                - "Globalny"
                - "Obiekt"
            -
              type: "text"
              id: "style-info"
              text: "Edytujesz"
              text_bind: "world.npr.settings.NprSettings.style_info"
            -
              type: "column"
              id: "style-editor"
              enabled_bind: "world.npr.settings.NprSettings.appearance_editable"
              children:
                -
                  type: "option-set"
                  id: "style-preset"
                  text: "Gotowy styl"
                  value_bind: "world.npr.settings.NprSettings.style_preset"
                  options:
                    - "Comic Ink"
                    - "Pencil Study"
                    - "Loose Study"
                    - "Confident Ink"
                    - "Broad Nib"
                    - "Blueprint"
                    - "Soft Toon"
                -
                  type: "group-box"
                  id: "outlines"
                  text: "Kontury"
                  children:
                    -
                      type: "slider"
                      id: "ink-outline_width"
                      text: "Sylwetka"
                      value_bind: "world.npr.settings.NprSettings.appearance.outline_width"
                      min: 0
                      max: 20
                      step: 0.1
                    -
                      type: "slider"
                      id: "ink-crease_width"
                      text: "Załamania"
                      value_bind: "world.npr.settings.NprSettings.appearance.crease_width"
                      min: 0
                      max: 20
                      step: 0.1
                    -
                      type: "slider"
                      id: "ink-min_crease_length_pixels"
                      text: "Minimalna długość załamania"
                      tooltip: "Krótsze wewnętrzne chainy crease nie są tessellowane. Sylwetka i otwarte granice zawsze pozostają."
                      value_bind: "world.npr.settings.NprSettings.appearance.min_crease_length_pixels"
                      min: 0
                      max: 64
                      step: 0.5
                    -
                      type: "toggle"
                      id: "ink-suggestive-contours"
                      text: "Kontury sugerowane"
                      tooltip: "Cienkie, widokozależne linie formy na powierzchniach Smooth."
                      value_bind: "world.npr.settings.NprSettings.appearance.suggestive_contours"
                    -
                      type: "slider"
                      id: "ink-suggestive-contour-confidence"
                      text: "Pewność konturów sugerowanych"
                      tooltip: "Wyższa wartość odrzuca niepewne linie z nieregularnej triangulacji."
                      value_bind: "world.npr.settings.NprSettings.appearance.suggestive_contour_confidence"
                      min: 0
                      max: 1
                      step: 0.01
                    -
                      type: "slider"
                      id: "ink-suggestive-contour-width"
                      text: "Grubość konturów sugerowanych"
                      value_bind: "world.npr.settings.NprSettings.appearance.suggestive_contour_width_scale"
                      min: 0
                      max: 2
                      step: 0.01
                    -
                      type: "slider"
                      id: "ink-suggestive-contour-opacity"
                      text: "Krycie konturów sugerowanych"
                      value_bind: "world.npr.settings.NprSettings.appearance.suggestive_contour_opacity"
                      min: 0
                      max: 1
                      step: 0.01
                    -
                      type: "slider"
                      id: "ink-boundary_width"
                      text: "Otwarte brzegi"
                      value_bind: "world.npr.settings.NprSettings.appearance.boundary_width"
                      min: 0
                      max: 20
                      step: 0.1
                -
                  type: "group-box"
                  id: "gesture"
                  text: "Gest ręki"
                  children:
                    -
                      type: "option-set"
                      id: "tool"
                      text: "Narzędzie"
                      value_bind: "world.npr.settings.NprSettings.appearance.tool"
                      options:
                        - "pencil"
                        - "fineliner"
                        - "nib"
                        - "brush"
                    -
                      type: "slider"
                      id: "gesture-confidence"
                      text: "Pewność pociągnięcia"
                      value_bind: "world.npr.settings.NprSettings.appearance.gesture_confidence"
                      min: 0
                      max: 1
                      step: 0.01
                    -
                      type: "slider"
                      id: "gesture-simplification"
                      text: "Uproszczenie przebiegu"
                      value_bind: "world.npr.settings.NprSettings.appearance.gesture_simplification"
                      min: 0
                      max: 1
                      step: 0.01
                    -
                      type: "slider"
                      id: "gesture-correction"
                      text: "Lokalne poprawki"
                      value_bind: "world.npr.settings.NprSettings.appearance.gesture_correction"
                      min: 0
                      max: 1
                      step: 0.01
                    -
                      type: "slider"
                      id: "gesture-overstroke"
                      text: "Drugie pociągnięcie"
                      value_bind: "world.npr.settings.NprSettings.appearance.gesture_overstroke"
                      min: 0
                      max: 1
                      step: 0.01
                -
                  type: "group-box"
                  id: "tool-response"
                  text: "Reakcja narzędzia"
                  children:
                    -
                      type: "slider"
                      id: "tool-pressure"
                      text: "Nacisk"
                      value_bind: "world.npr.settings.NprSettings.appearance.tool_pressure"
                      min: 0
                      max: 1
                      step: 0.01
                    -
                      type: "slider"
                      id: "tool-hardness"
                      text: "Twardość / krycie"
                      value_bind: "world.npr.settings.NprSettings.appearance.tool_hardness"
                      min: 0
                      max: 1
                      step: 0.01
                    -
                      type: "slider"
                      id: "nib-angle"
                      text: "Kąt stalówki"
                      value_bind: "world.npr.settings.NprSettings.appearance.nib_angle"
                      min: -180
                      max: 180
                      step: 1
                    -
                      type: "slider"
                      id: "nib-aspect"
                      text: "Rozwarcie stalówki"
                      value_bind: "world.npr.settings.NprSettings.appearance.nib_aspect"
                      min: 0
                      max: 1
                      step: 0.01
                -
                  type: "group-box"
                  id: "paper-character"
                  text: "Papier i ślad"
                  children:
                    -
                      type: "slider"
                      id: "paper-tooth"
                      text: "Zęby papieru"
                      value_bind: "world.npr.settings.NprSettings.appearance.paper_tooth"
                      min: 0
                      max: 1
                      step: 0.01
                    -
                      type: "slider"
                      id: "paper-grain"
                      text: "Ziarnistość śladu"
                      value_bind: "world.npr.settings.NprSettings.appearance.paper_grain"
                      min: 0
                      max: 1
                      step: 0.01
                    -
                      type: "slider"
                      id: "ink-dryness"
                      text: "Suchość tuszu"
                      value_bind: "world.npr.settings.NprSettings.appearance.ink_dryness"
                      min: 0
                      max: 1
                      step: 0.01
                -
                  type: "group-box"
                  id: "colors"
                  text: "Trzy pasma koloru i tusz"
                  children:
                    -
                      type: "color-picker-rgb"
                      id: "ink-ink"
                      text: "Tusz"
                      value_bind: "world.npr.settings.NprSettings.appearance.ink"
                    -
                      type: "color-picker-rgb"
                      id: "ink-shadow"
                      text: "Cień"
                      value_bind: "world.npr.settings.NprSettings.appearance.shadow"
                    -
                      type: "color-picker-rgb"
                      id: "ink-mid"
                      text: "Półton"
                      value_bind: "world.npr.settings.NprSettings.appearance.mid"
                    -
                      type: "color-picker-rgb"
                      id: "ink-light"
                      text: "Światło"
                      value_bind: "world.npr.settings.NprSettings.appearance.light"
                -
                  type: "group-box"
                  id: "advanced"
                  text: "Zaawansowane"
                  children:
                    -
                      type: "slider"
                      id: "ink-crease_angle"
                      text: "Próg załamania"
                      value_bind: "world.npr.settings.NprSettings.appearance.crease_angle"
                      min: 0
                      max: 180
                      step: 1
                    -
                      type: "slider"
                      id: "ink-smooth_crease_angle"
                      text: "Próg gładkiej powierzchni"
                      tooltip: "W trybie Smooth normalne nie są mieszane przez ostrzejsze krawędzie. To nie zmienia progu rysowanych załamań."
                      value_bind: "world.npr.settings.NprSettings.appearance.smooth_crease_angle"
                      min: 0
                      max: 180
                      step: 1
                    -
                      type: "slider"
                      id: "ink-taper"
                      text: "Zwężenie końców"
                      value_bind: "world.npr.settings.NprSettings.appearance.taper"
                      min: 0
                      max: 1
                      step: 0.01
                    -
                      type: "slider"
                      id: "ink-wobble"
                      text: "Nieregularność linii"
                      value_bind: "world.npr.settings.NprSettings.appearance.wobble"
                      min: 0
                      max: 10
                      step: 0.1
                    -
                      type: "group-box"
                      id: "tone"
                      text: "Ton i kreskowanie"
                      children:
                        -
                          type: "slider"
                          id: "ink-tone-density"
                          text: "Gęstość tonu"
                          value_bind: "world.npr.settings.NprSettings.appearance.tone_density"
                          min: 0
                          max: 1
                          step: 0.01
                        -
                          type: "slider"
                          id: "ink-min-form-line-confidence"
                          text: "Form-line confidence"
                          tooltip: "Suppresses tonal strokes where the local tangent is ambiguous or normal curvature changes too abruptly."
                          value_bind: "world.npr.settings.NprSettings.appearance.min_form_line_confidence"
                          min: 0
                          max: 1
                          step: 0.01
                        -
                          type: "slider"
                          id: "ink-form-line-width"
                          text: "Grubość linii formy"
                          value_bind: "world.npr.settings.NprSettings.appearance.form_line_width_scale"
                          min: 0
                          max: 2
                          step: 0.01
                        -
                          type: "slider"
                          id: "ink-form-line-opacity"
                          text: "Krycie linii formy"
                          value_bind: "world.npr.settings.NprSettings.appearance.form_line_opacity"
                          min: 0
                          max: 1
                          step: 0.01
                        -
                          type: "slider"
                          id: "ink-hatching-angle"
                          text: "Kąt kreskowania"
                          value_bind: "world.npr.settings.NprSettings.appearance.hatching_angle"
                          min: -180
                          max: 180
                          step: 1
                        -
                          type: "slider"
                          id: "ink-hatching-spacing"
                          text: "Odstęp kresek"
                          value_bind: "world.npr.settings.NprSettings.appearance.hatching_spacing"
                          min: 1
                          max: 40
                          step: 0.5
                        -
                          type: "slider"
                          id: "ink-hatching-cross"
                          text: "Kreskowanie krzyżowe"
                          value_bind: "world.npr.settings.NprSettings.appearance.hatching_cross"
                          min: 0
                          max: 1
                          step: 0.01
            -
              type: "button"
              id: "reset-style"
              text: "Przywróć styl / dziedziczenie"
              on_click:
                event: "npr.reset_style"
              enabled_bind: "world.npr.settings.NprSettings.editable"
            -
              type: "group-box"
              id: "comparison"
              text: "Porównanie wyglądu"
              children:
                -
                  type: "button"
                  id: "capture-before"
                  text: "Zapamiętaj bieżący wygląd"
                  on_click:
                    event: "npr.capture_before"
                  enabled_bind: "world.npr.settings.NprSettings.editable"
                -
                  type: "toggle"
                  id: "preview-before"
                  text: "Pokaż zapamiętany wygląd (Przed)"
                  value_bind: "world.npr.settings.NprSettings.preview_before"
                  enabled_bind: "world.npr.settings.NprSettings.can_compare"
                -
                  type: "text"
                  id: "comparison-help"
                  text: "Porównanie zachowuje kamerę i animację. Wyłącz „Przed”, aby edytować."
        -
          type: "column"
          id: "object"
          enabled_bind: "world.npr.settings.NprSettings.editable"
          children:
            -
              type: "text"
              id: "object-title"
              text: "Wybrany obiekt"
              text_bind: "world.npr.settings.NprSettings.selected"
            -
              type: "dropdown"
              id: "object-model"
              text: "Geometria"
              value_bind: "world.npr.settings.NprSettings.object.model"
              options:
                - "cube"
                - "wedge"
                - "cylinder"
                - "sphere"
                - "suzanne"
                - "avocado"
            -
              type: "option-set"
              id: "object-surface-mode"
              text: "Interpretacja powierzchni"
              tooltip: "Gładka buduje sylwetkę z pola normalnych, zamiast rysować krawędzie triangulacji. Polygonal zachowuje ostre formy, np. cube."
              value_bind: "world.npr.settings.NprSettings.object.surface_mode"
              options:
                - "polygonal"
                - "smooth"
            -
              type: "slider"
              id: "object-surface-subdivision-level"
              text: "Smooth proxy level"
              tooltip: "Prepared once per source revision and crease threshold. Zero uses the authored surface; higher levels smooth organic contours within a fixed triangle budget."
              value_bind: "world.npr.settings.NprSettings.object.surface_subdivision_level"
              min: 0
              max: 2
              step: 1
            -
              type: "slider"
              id: "object-smooth-weld-tolerance"
              text: "Seam weld tolerance"
              tooltip: "Relative radius used only by Smooth proxy. Zero preserves only exact matching positions; a small value removes tiny importer seams without changing Polygonal objects."
              value_bind: "world.npr.settings.NprSettings.object.smooth_weld_relative_tolerance"
              min: 0
              max: 0.0001
              step: 0.000001
            -
              type: "row"
              id: "object-flags"
              children:
                -
                  type: "toggle"
                  id: "object-visible"
                  text: "Widoczny"
                  value_bind: "world.npr.settings.NprSettings.object.visible"
                -
                  type: "toggle"
                  id: "object-rotating"
                  text: "Obraca się"
                  value_bind: "world.npr.settings.NprSettings.object.rotating"
            -
              type: "group-box"
              id: "transform"
              text: "Transformacja"
              children:
                -
                  type: "slider"
                  id: "object-position"
                  text: "Pozycja"
                  value_bind: "world.npr.settings.NprSettings.object.position"
                -
                  type: "slider"
                  id: "object-rotation"
                  text: "Obrót"
                  value_bind: "world.npr.settings.NprSettings.object.rotation"
                -
                  type: "slider"
                  id: "object-scale"
                  text: "Skala"
                  value_bind: "world.npr.settings.NprSettings.object.scale"
                  min: 0.01
                  max: 10
                  step: 0.01
                -
                  type: "button"
                  id: "reset-transform"
                  text: "Reset transformacji"
                  on_click:
                    event: "npr.reset_transform"
            -
              type: "group-box"
              id: "rotation"
              text: "Animacja obiektu"
              children:
                -
                  type: "slider"
                  id: "object-angular-speed"
                  text: "Prędkość kątowa"
                  value_bind: "world.npr.settings.NprSettings.object.angular_speed"
                -
                  type: "button"
                  id: "reset-rotation"
                  text: "Reset obrotu"
                  on_click:
                    event: "npr.reset_rotation"
            -
              type: "group-box"
              id: "construction-marks"
              text: "Linia konstrukcyjna"
              children:
                -
                  type: "text"
                  id: "construction-status"
                  text_bind: "world.npr.settings.NprSettings.construction_authoring_status"
                -
                  type: "button"
                  id: "begin-construction-mark"
                  text: "Nowa kreska"
                  tooltip: "Wybierz punkty na aktualnie wybranym modelu. Punkty są zapisywane na powierzchni, nie na ekranie."
                  on_click:
                    event: "npr.begin_construction_mark"
                -
                  type: "button"
                  id: "commit-construction-mark"
                  text: "Zatwierdź linię"
                  enabled_bind: "world.npr.settings.NprSettings.construction_authoring_can_commit"
                  on_click:
                    event: "npr.commit_construction_mark"
                -
                  type: "button"
                  id: "close-construction-mark"
                  text: "Zamknij i zatwierdź"
                  enabled_bind: "world.npr.settings.NprSettings.construction_authoring_can_close"
                  on_click:
                    event: "npr.close_construction_mark"
                -
                  type: "button"
                  id: "cancel-construction-mark"
                  text: "Anuluj wybór"
                  enabled_bind: "world.npr.settings.NprSettings.construction_authoring_active"
                  on_click:
                    event: "npr.cancel_construction_mark"
                -
                  type: "button"
                  id: "undo-construction-anchor"
                  text: "Cofnij punkt"
                  enabled_bind: "world.npr.settings.NprSettings.construction_authoring_can_undo_point"
                  on_click:
                    event: "npr.undo_construction_anchor"
                -
                  type: "text"
                  id: "construction-summary"
                  text_bind: "world.npr.settings.NprSettings.construction_mark_summary"
                -
                  type: "row"
                  id: "construction-selection"
                  children:
                    -
                      type: "button"
                      id: "construction-previous"
                      text: "← Poprzednia"
                      enabled_bind: "world.npr.settings.NprSettings.construction_mark_can_select_previous"
                      on_click:
                        event: "npr.select_previous_construction_mark"
                    -
                      type: "button"
                      id: "construction-next"
                      text: "Następna →"
                      enabled_bind: "world.npr.settings.NprSettings.construction_mark_can_select_next"
                      on_click:
                        event: "npr.select_next_construction_mark"
                -
                  type: "group-box"
                  id: "construction-selected-style"
                  text: "Wybrana linia"
                  enabled_bind: "world.npr.settings.NprSettings.construction_mark_can_edit"
                  children:
                    -
                      type: "toggle"
                      id: "construction-selected-closed"
                      text: "Zamknięta pętla"
                      tooltip: "Wymaga co najmniej trzech punktów na powierzchni."
                      value_bind: "world.npr.settings.NprSettings.construction_mark_selected_closed"
                    -
                      type: "slider"
                      id: "construction-selected-width"
                      text: "Skala grubości"
                      value_bind: "world.npr.settings.NprSettings.construction_mark_selected_width_scale"
                      min: 0
                      max: 2
                      step: 0.01
                    -
                      type: "slider"
                      id: "construction-selected-opacity"
                      text: "Krycie"
                      value_bind: "world.npr.settings.NprSettings.construction_mark_selected_opacity"
                      min: 0
                      max: 1
                      step: 0.01
                -
                  type: "button"
                  id: "delete-selected-construction-mark"
                  text: "Usuń wybraną linię"
                  enabled_bind: "world.npr.settings.NprSettings.construction_mark_can_delete"
                  on_click:
                    event: "npr.delete_selected_construction_mark"
            -
              type: "group-box"
              id: "inheritance"
              text: "Dziedziczenie stylu"
              children:
                -
                  type: "toggle"
                  id: "object-override"
                  text: "Własny styl obiektu"
                  value_bind: "world.npr.settings.NprSettings.object.override_style"
                -
                  type: "text"
                  id: "inheritance-help"
                  text: "Włączenie kopiuje styl globalny. Wyłączenie przywraca dziedziczenie. Kolory edytuj w Wygląd → Obiekt."
        -
          type: "column"
          id: "scene"
          enabled_bind: "world.npr.settings.NprSettings.editable"
          children:
            -
              type: "group-box"
              id: "environment"
              text: "Otoczenie"
              children:
                -
                  type: "color-picker-rgb"
                  id: "paper"
                  text: "Kolor papieru"
                  value_bind: "world.npr.settings.NprSettings.global.paper"
                -
                  type: "slider"
                  id: "light-direction"
                  text: "Kierunek światła"
                  value_bind: "world.npr.settings.NprSettings.global.light_direction"
            -
              type: "group-box"
              id: "arrangement"
              text: "Rozmieszczenie"
              children:
                - type: toggle
                  id: highlight-selected
                  text: Znacznik wybranego obiektu w galerii
                  value_bind: world.npr.settings.NprSettings.highlight_selected
                -
                  type: "button"
                  id: "layout-grid"
                  text: "Ułóż w siatkę 3 × 2"
                  on_click:
                    event: "npr.layout_grid"
                -
                  type: "text"
                  id: "layout-help"
                  text: "Pozycje obiektów można zmieniać niezależnie w zakładce Obiekt."
        -
          type: "column"
          id: "camera"
          enabled_bind: "world.npr.settings.NprSettings.editable"
          children:
            -
              type: "row"
              id: "camera-views"
              children:
                -
                  type: "button"
                  id: "fit"
                  text: "Dopasuj widok"
                  on_click:
                    event: "npr.fit"
                -
                  type: "button"
                  id: "front"
                  text: "Przód"
                  on_click:
                    event: "npr.camera_front"
                -
                  type: "button"
                  id: "side"
                  text: "Bok"
                  on_click:
                    event: "npr.camera_side"
                -
                  type: "button"
                  id: "top"
                  text: "Góra"
                  on_click:
                    event: "npr.camera_top"
            -
              type: "slider"
              id: "camera-yaw"
              text: "Azymut"
              value_bind: "world.npr.settings.NprSettings.camera_yaw"
              min: -180
              max: 180
              step: 1
            -
              type: "slider"
              id: "camera-pitch"
              text: "Elewacja"
              value_bind: "world.npr.settings.NprSettings.camera_pitch"
              min: -89
              max: 89
              step: 1
            -
              type: "slider"
              id: "camera-distance"
              text: "Odległość"
              value_bind: "world.npr.settings.NprSettings.camera_distance"
              min: 0.1
              max: 100
              step: 0.1
            -
              type: "slider"
              id: "camera-fov"
              text: "Pole widzenia"
              value_bind: "world.npr.settings.NprSettings.camera_fov"
              min: 15
              max: 90
              step: 1
            -
              type: "slider"
              id: "camera-target"
              text: "Punkt obserwacji"
              value_bind: "world.npr.settings.NprSettings.camera_target"
        -
          type: "column"
          id: "presets"
          enabled_bind: "world.npr.settings.NprSettings.editable"
          children:
            - type: option-set
              id: preset-kind
              text: Zakres presetu
              value_bind: world.npr.settings.NprSettings.preset_kind
              options: [Scena, Wygląd]
            -
              type: "text"
              id: "preset-help"
              text: "Presety sceny obejmują wszystkie obiekty, kamerę, animację i style. Gotowe style bez zmiany sceny znajdziesz w zakładce Wygląd."
            -
              type: "slider"
              id: "preset-name"
              text: "Nazwa presetu"
              value_bind: "world.npr.settings.NprSettings.preset_name"
            -
              type: "row"
              id: "preset-actions"
              children:
                -
                  type: "button"
                  id: "save"
                  text: "Zapisz nowy"
                  on_click:
                    event: "npr.save"
                -
                  type: "button"
                  id: "load"
                  text: "Wczytaj"
                  on_click:
                    event: "npr.load"
                -
                  type: "button"
                  id: "overwrite"
                  text: "Nadpisz…"
                  on_click:
                    event: "npr.overwrite"
            -
              type: "button"
              id: "reset"
              text: "Reset całej sceny…"
              on_click:
                event: "npr.reset"
            -
              type: "text"
              id: "preset-name-help"
              text: "Nazwa: litery ASCII, cyfry, myślnik lub podkreślenie. Zmiany można cofnąć."
        -
          type: "column"
          id: "diagnostics"
          enabled_bind: "world.npr.settings.NprSettings.editable"
          children:
            -
              type: "option-set"
              id: "debug"
              text: "Tryb podglądu"
              value_bind: "world.npr.settings.NprSettings.debug"
              options:
                - "Final"
                - "FeatureClasses"
                - "StrokeIds"
            -
              type: "text"
              id: "debug-help"
              text: "FeatureClasses: zielony — sylwetka, niebieski — załamanie, czerwony — otwarty brzeg. StrokeIds: kolor oznacza ID kreski."
            -
              type: "slider"
              id: "seed"
              text: "Seed nieregularności"
              value_bind: "world.npr.settings.NprSettings.seed"
            -
              type: "text"
              id: "debug-note"
              text: "Miniatury pokazują geometrię w neutralnym ujęciu; nie są podglądem bieżącej animacji."
