              text_bind: world.npr.settings.NprSettings.stats.silhouettes
            - type: text
              id: stats-creases
              text: Załamania
              text_bind: world.npr.settings.NprSettings.stats.creases
            - type: text
              id: stats-smooth-contours
              text: Kontury gladkie
              text_bind: world.npr.settings.NprSettings.stats.smooth_contour_spans
            - type: text
              id: stats-suggestive-contours
              text: Kontury sugerowane
              text_bind: world.npr.settings.NprSettings.stats.suggestive_contour_spans
            - type: text
              id: stats-strokes
              text: Kreski
              text_bind: world.npr.settings.NprSettings.stats.strokes
            - type: text
              id: stats-vertices
              text: Wierzchołki kresek
              text_bind: world.npr.settings.NprSettings.stats.stroke_vertices
            - type: text
              id: stats-indices
              text: Indeksy kresek
              text_bind: world.npr.settings.NprSettings.stats.stroke_indices
            - type: text
              id: stats-hatching
              text: Kreski tonalne
              text_bind: world.npr.settings.NprSettings.stats.hatching_strokes
            - type: text
              id: stats-hatching-confidence-rejected
              text: Odrzucone niepewne kreski tonalne
              text_bind: world.npr.settings.NprSettings.stats.hatching_confidence_rejected
            - type: text
              id: stats-construction
              text: Linie konstrukcyjne
              text_bind: world.npr.settings.NprSettings.stats.construction_marks
            - type: text
              id: stats-temporal-retained
              text: Zachowane kreski w ruchu
              text_bind: world.npr.settings.NprSettings.stats.temporal_retained_strokes
            - type: text
              id: stats-temporal-entering
              text: Nowe kreski w ruchu
              text_bind: world.npr.settings.NprSettings.stats.temporal_entering_strokes
            - type: text
              id: stats-stroke-budget-rejected
              text: Odrzucone przez budzet kresek
              text_bind: world.npr.settings.NprSettings.stats.stroke_budget_rejected
            - type: row
              id: stats-viewport
              children:
                - type: text
                  id: stats-width
                  text: Szerokość
                  text_bind: world.npr.settings.NprSettings.stats.viewport_width
                - type: text
                  id: stats-height
                  text: Wysokość
                  text_bind: world.npr.settings.NprSettings.stats.viewport_height
    -
      type: "row"
      id: "footer"
      children:
        -
          type: "text"
          id: "connection"
          text: "Połączono"
        -
          type: "text"
