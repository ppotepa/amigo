kind: ui-main-menu
schema_version: 1
id: main-menu
label: 'Main Menu'
target:
  type: screen-space
  layer: menu
  viewport:
    width: 1280.0
    height: 720.0
    scaling: fit
root:
  type: column
  id: root
  style:
    left: 0.0
    top: 0.0
    width: 1280.0
    height: 720.0
    padding: 0.0
    gap: 20.0
    background: '#00000000'
  children:
    - type: spacer
      id: top-space
      style:
        width: 1280.0
        height: 220.0
    - type: button
      id: start
      style_class: menu_button_primary
      text: 'START'
      font: rotten-club/fonts/game
      style:
        width: 1280.0
        height: 96.0
        font_size: 72.0
      on_click:
        event: menu.start
    - type: button
      id: options
      style_class: menu_button
      text: 'OPTIONS'
      font: rotten-club/fonts/game
      style:
        width: 1280.0
        height: 96.0
        font_size: 72.0
      on_click:
        event: menu.options
    - type: button
      id: quit
      style_class: menu_button
      text: 'EXIT'
      font: rotten-club/fonts/game
      style:
        width: 1280.0
        height: 96.0
        font_size: 72.0
      on_click:
        event: menu.quit

