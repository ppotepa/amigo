kind: layered-image-2d
schema_version: 1
id: neon-alley
label: Neon Alley Light Decomposition

canvas:
  width: 1672
  height: 941

base:
  image: base_albedo.png

layers:
  - id: rain_relief_edges
    label: Rain Relief Edges
    image: base_albedo.png
    blend: lighten
    default_opacity: 0.0
    color: '#DDE8FF'
    animation_hint: ambient
    post_fx:
      kind: embossed_edges
      mode: light_aware_runtime
      intensity: 11.9
      edge_strength: 1.75
      sample_offset_px: 1.0
      luma_threshold: 0.22
      luma_gamma: 2.2
      specular_radius_px: 6.0
      distance_falloff: 0.18
      tint: 0.86,0.91,1.0

  - id: club_sign
    label: Rotten Club Sign
    image: light_001_magenta_rotten_club_sign.png
    blend: lighten
    default_opacity: 1.0
    color: '#FF1493'
    animation_hint: neon_flicker

  - id: bar_sign
    label: Bar Sign And Interior
    image: light_002_amber_bar_sign_and_interior.png
    blend: lighten
    default_opacity: 0.95
    color: '#FF9A1F'

  - id: pharmacy_cross
    label: Pharmacy Cross
    image: light_003_green_pharmacy_cross.png
    blend: lighten
    default_opacity: 0.75
    color: '#36FF36'
    animation_hint: pulse

  - id: bar_lanterns
    label: Bar Lanterns
    image: light_004_warm_bar_lanterns.png
    blend: lighten
    default_opacity: 0.8
    color: '#FF8C1A'

  - id: skyline
    label: Cool City Skyline
    image: light_005_cool_city_skyline.png
    blend: lighten
    default_opacity: 0.85
    color: '#3AA8FF'
    animation_hint: ambient

  - id: club_entry
    label: Club Entry Lights
    image: light_007_magenta_club_entry_lights.png
    blend: lighten
    default_opacity: 0.85
    color: '#FF1493'
    animation_hint: flicker

  - id: menu2_bar_warm_interior
