version: 1
scene:
  id: start
  label: Start
  description: 'Initial placeholder scene for Rotten Club.'
entities:
  - id: camera
    name: 'camera'
    components:
      - type: Camera2D

  - id: backdrop
    name: 'backdrop'
    components:
      - type: VectorShape2D
        kind: polygon
        points:
          - x: -2400.0
            y: -1600.0
          - x: 2400.0
            y: -1600.0
          - x: 2400.0
            y: 1600.0
          - x: -2400.0
            y: 1600.0
        stroke_color: '#00000000'
        stroke_width: 0.0
        fill_color: '#050812FF'
        z_index: -100.0

  - id: title
    name: 'title'
    transform2:
      translation:
        x: 0.0
        y: -60.0
      rotation_radians: 0.0
      scale:
        x: 1.0
        y: 1.0
    components:
      - type: Text2D
        content: 'ROTTEN CLUB'
        font: 'rotten-club/fonts/debug-ui'
        bounds:
          x: 720.0
          y: 96.0

  - id: subtitle
    name: 'subtitle'
    transform2:
      translation:
        x: 0.0
        y: 48.0
      rotation_radians: 0.0
      scale:
        x: 1.0
        y: 1.0
    components:
      - type: Text2D
        content: 'New 2D project placeholder'
        font: 'rotten-club/fonts/debug-ui'
        bounds:
          x: 640.0
          y: 64.0
