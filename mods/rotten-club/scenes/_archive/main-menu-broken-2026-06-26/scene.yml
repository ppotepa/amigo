version: 1
scene:
  id: main-menu
  label: Rotten Club Main Menu
  description: Plugin-owned Rotten Club main menu with authored timeline tracks and a small lifecycle script.

use:
  scheduling:
    - ./scheduling.yml
  timeline:
    - ./timeline/intro.yml
  camera:
    - ./camera/main.yml
  render:
    - ./render/layers.yml
    - ./render/postfx.yml
  world:
    - ./world/background.yml
    - ./world/depth.yml
    - ./world/title.yml
  lighting:
    - ./lighting/global.yml
    - ./lighting/beacons.yml
    - ./lighting/groups.yml
  weather:
    - ./weather/rain.yml
  state:
    - ./state/defaults.yml

script: ./scene.rhai
