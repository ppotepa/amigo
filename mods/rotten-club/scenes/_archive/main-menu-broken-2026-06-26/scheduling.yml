kind: scene-fragment
schema_version: 1

scheduling:
  frame_clock:
    strategy: fixed_simulation_sampled_render
    simulation_fps: 12.0
    render_fps: 12.0
    max_catch_up_ticks: 1
    clamp_frame_delta_seconds: 0.05

    presentation:
      cache_game_frame: true
      hold_last_game_frame: true
      game_ui: cached
      devtools: live
      editor: live
      debug_overlay: live
