kind: scene-fragment
schema_version: 1

entities:
  - id: background
    name: rotten-club-background
    tags: [background, layered-image, world]
    transform2:
      translation: { x: 0.0, y: 0.0 }
      rotation_degrees: 0.0
      scale: { x: 1.0, y: 1.0 }
    components:
      - type: amigo.gfx.layered-image-2d.LayeredImage2D
        render_layer: background.city
        asset: rotten-club/layered-images/neon-alley
        size: { x: 1672.0, y: 941.0 }
        base_opacity: 1.0
        viewport_fit: cover
        z_index: -100.0
        visual_maps:
          highlight: rotten-club/visual-maps/neon-alley-highlight
        layer_overrides:
          - { id: skyline, opacity: 0.82 }
          - { id: club_sign, opacity: 0.95 }
          - { id: club_entry, opacity: 0.72 }
          - { id: bar_sign, opacity: 0.65 }
          - { id: bar_lanterns, opacity: 0.58 }
          - { id: pharmacy_cross, opacity: 0.38 }
          - { id: rain_relief_edges, opacity: 0.18 }
      - type: LightMap2DSource
        id: neon-alley-lightmap
        source:
          kind: layered_image_2d
          entity: rotten-club-background
        channels:
          - id: far_city
            layers: [skyline]
          - id: mid_neon
            layers: [club_sign, club_entry, pharmacy_cross]
          - id: near_bar
            layers: [bar_sign, bar_lanterns]
