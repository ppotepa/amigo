kind: scene-fragment
schema_version: 1

visual2d:
  spatial:
    depth_space:
      near_m: 0.2
      far_m: 1500.0
      curve: logarithmic
  render_layers:
  - id: background.city
    label: Background City
    order: -100.0
    visible: true
    opacity: 1.0
    optical_role: world_surface
    depth:
      mode: depth_map
  - id: weather.rain.horizon
    label: Horizon Rain 150m
    order: -18.0
    visible: true
    opacity: 1.0
    optical_role: scene_medium
    depth:
      mode: distance
      distance_m: 150.0
      blur_scale: 1.25
  - id: weather.rain.far
    label: Far Rain 90m
    order: -17.0
    visible: true
    opacity: 1.0
    optical_role: scene_medium
    depth:
      mode: distance
      distance_m: 90.0
      blur_scale: 1.15
  - id: weather.rain.mid_far
    label: Mid-Far Rain 50m
    order: -16.0
    visible: true
    opacity: 1.0
    optical_role: scene_medium
    depth:
      mode: distance
      distance_m: 50.0
      blur_scale: 1.0
  - id: weather.rain.mid
    label: Mid Rain 25m
    order: -15.0
    visible: true
    opacity: 1.0
    optical_role: scene_medium
    depth:
      mode: distance
      distance_m: 25.0
      blur_scale: 0.85
  - id: weather.rain.street
    label: Street Rain 10m
    order: -14.0
    visible: true
    opacity: 1.0
    optical_role: foreground_medium
    depth:
      mode: distance
      distance_m: 10.0
      blur_scale: 0.75
  - id: weather.rain.near
    label: Near Rain 5m
    order: -13.0
    visible: true
    opacity: 1.0
    optical_role: foreground_medium
    depth:
      mode: distance
      distance_m: 5.0
      blur_scale: 0.85
  - id: weather.rain.close
    label: Close Rain 2m
    order: 20.0
    visible: true
    opacity: 1.0
    optical_role: foreground_medium
    depth:
      mode: distance
      distance_m: 2.0
      blur_scale: 1.0
  - id: weather.rain.front
    label: Front Rain 1m
    order: 35.0
    visible: true
    opacity: 1.0
    optical_role: foreground_medium
    depth:
      mode: distance
      distance_m: 1.0
      blur_scale: 1.1
  - id: weather.rain.lens
    label: Lens Rain 0.5m
    order: 48.0
    visible: true
    opacity: 1.0
    optical_role: foreground_medium
    depth:
      mode: distance
      distance_m: 0.5
      blur_scale: 1.25
  - id: weather.rain.micro
    label: Camera-Proximate Rain 0.2m
    order: 60.0
    visible: true
    opacity: 1.0
    optical_role: foreground_medium
    depth:
      mode: distance
      distance_m: 0.2
      blur_scale: 1.4
  - id: ui
    label: UI
    order: 1000.0
    visible: true
    opacity: 1.0
    optical_role: overlay
    depth:
      mode: overlay
