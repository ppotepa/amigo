kind: scene-fragment
schema_version: 1

visual2d:
  spatial:
    depth_space:
      near_m: 0.2
      far_m: 1500.0
      curve: logarithmic
  render_layers:
    - id: background.city
      label: Background City
      order: -100.0
      visible: true
      opacity: 1.0
      optical_role: world_surface
      depth:
        mode: depth_map
        z_depth: 0.08
        blur_scale: 1.0
    - id: weather.rain.far
      label: Far Rain
      order: -8.0
      visible: true
      opacity: 1.0
      optical_role: scene_medium
      depth:
        mode: distance
        distance_m: 18.0
        blur_scale: 0.55
    - id: weather.rain.near
      label: Near Rain
      order: 8.0
      visible: true
      opacity: 1.0
      optical_role: foreground_medium
      depth:
        mode: distance
        distance_m: 2.0
        blur_scale: 1.0
    - id: lighting.neon
      label: Neon Beacons
      order: 12.0
      visible: true
      opacity: 1.0
      optical_role: scene_medium
      depth:
        mode: distance
        distance_m: 7.5
        blur_scale: 0.65
    - id: title.depth2d
      label: Rotten Club Title
      order: 30.0
      visible: true
      opacity: 0.0
      optical_role: foreground_medium
      depth:
        mode: distance
        distance_m: 4.5
        blur_scale: 0.45
