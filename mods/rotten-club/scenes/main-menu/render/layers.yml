kind: scene-fragment
schema_version: 1

visual2d:
  spatial:
    depth_space:
      near_m: 0.2
      far_m: 1500.0
      curve: logarithmic
  render_layers:
  - id: background.city
    label: Background City
    order: -100.0
    visible: true
    opacity: 1.0
    optical_role: world_surface
    depth:
      mode: depth_map
      z_depth: 0.08
      blur_scale: 1.0
  - id: weather.rain.10m
    label: Rain 10m
    order: -14.0
    visible: true
    opacity: 1.0
    optical_role: scene_medium
    depth:
      mode: distance
      distance_m: 10.0
      blur_scale: 0.75
  - id: weather.rain.5m
    label: Rain 5m
    order: -13.0
    visible: true
    opacity: 1.0
    optical_role: foreground_medium
    depth:
      mode: distance
      distance_m: 5.0
      blur_scale: 0.85
  - id: weather.rain.1m
    label: Rain 1m
    order: 35.0
    visible: true
    opacity: 1.0
    optical_role: foreground_medium
    depth:
      mode: distance
      distance_m: 1.0
      blur_scale: 1.1
  - id: weather.rain.super_near
    label: Rain Super Near
    order: 60.0
    visible: true
    opacity: 1.0
    optical_role: foreground_medium
    depth:
      mode: distance
      distance_m: 0.2
      blur_scale: 1.4
  - id: title.depth2d
    label: Rotten Club Title
    order: 20.0
    visible: true
    opacity: 1.0
    optical_role: foreground_medium
    depth:
      mode: distance
      distance_m: 1.0
      blur_scale: 1.0
  - id: ui
    label: UI
    order: 1000.0
    visible: true
    opacity: 1.0
    optical_role: overlay
    depth:
      mode: overlay
