kind: scene-fragment
schema_version: 1

visual2d:
  render_layers:
  - id: background.city
    label: Background City
    order: -100.0
    visible: true
    opacity: 1.0
  - id: weather.rain.far
    label: Far Rain
    order: -18.0
    visible: true
    opacity: 1.0
  - id: weather.rain.mid
    label: Mid Rain
    order: -16.0
    visible: true
    opacity: 1.0
  - id: weather.rain.near
    label: Near Rain
    order: -14.0
    visible: true
    opacity: 1.0
  - id: weather.rain.front
    label: Front Rain
    order: 50.0
    visible: true
    opacity: 1.0
  - id: beacon.overlay
    label: Beacon Overlay
    order: 900.0
    visible: true
    opacity: 1.0
  - id: ui
    label: UI
    order: 1000.0
    visible: true
    opacity: 1.0
  light_groups:
  - id: skyline
    label: Skyline
    color: "#9bb8ff"
    intensity: 1.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: far_city
      response: 1.0
  - id: neon.mid
    label: Mid Neon
    color: "#ff66cc"
    intensity: 1.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: mid_neon
      response: 1.0
  - id: bar
    label: Bar
    color: "#ffcc66"
    intensity: 1.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: near_bar
      response: 1.0
  - id: lightning
    label: Lightning
    color: "#dbe8ff"
    intensity: 0.0
    sources:
    - kind: global_light
      id: lightning
      response: 1.0
  light_routes:
  - receiver_layer: weather.rain.far
    groups: [skyline, lightning]
  - receiver_layer: weather.rain.mid
    groups: [neon.mid, lightning]
  - receiver_layer: weather.rain.near
    groups: [bar, neon.mid, lightning]
  - receiver_layer: weather.rain.front
    groups: [skyline, neon.mid, bar, lightning]
  - receiver_layer: beacon.overlay
    groups: []
  - receiver_layer: ui
    groups: []
  post_fx:
  - type: rain_glass
    id: rotten_lens_rain_glass
    enabled: true
    spawn_rate: 10.0
    spawn_limit: 850
    spawn_size: [45.0, 118.0]
    opacity: 1.0
    refract_base: 0.34
    refract_scale: 0.76
    light_bump: 0.78
    seed: 121713
    simulation:
      gravity_px_per_sec2: 2400.0
      slip_rate: 0.34
      motion_interval: [0.08, 0.32]
      x_shifting: [0.00, 0.12]
      collider_scale: 1.0
      initial_spread: 0.52
      shrink_rate: 0.014
      velocity_spread: 0.34
      evaporate: 11.0
    trails:
      enabled: true
      density: 0.3224
      size: [0.2436, 0.5124]
      distance_px: [10.36, 21.76]
      spread: 1.06024
      shrink_rate: 0.364
      evaporate: 18.0
      taper: 0.68
      streak_boost: 0.72
      streak_length: 1.15
    micro_droplets:
      enabled: true
      per_second: 620.0
      size: [8.0, 27.0]
    mist:
      enabled: true
      opacity: 1.0
      blur_px: 4.0
      accumulation: 0.012
      time: 16.0
      color_strength: 0.012
      blur_step: 4
    render:
      reference_mode: true
      background_blur_px: 2.0
      background_blur_steps: 2
      smooth_edge: [0.945, 0.992]
      chromatic_aberration: 0.0
      distortion_px: 28.0
      normal_strength: 6.0
      focus_blur_strength: 0.85
      body_opacity: 1.0
      scene_blend: 0.92
      trail_refract_scale: 1.0
      trail_opacity: 1.0
      raindrop_compose: smoother
      raindrop_eraser_size: [0.93, 1.0]
    lighting:
      light_pos: [-1.0, 1.0, 2.0, 0.0]
      diffuse: [0.22, 0.22, 0.22]
      shadow_offset: 0.76
      specular: [0.025, 0.025, 0.025]
      specular_shininess: 300.0
      scene_light_response: 0.0
      rim_strength: 0.0
    debug:
      view: final
  - type: shutter_blur
    id: rotten_24fps_shutter
    fps: 12.0
    shutter_angle: 180.0
    opacity: 1.0
    history_mix: 0.3
    edge_rejection: 0.35
    luma_threshold: 0.04
    frame_hold: false
  - type: crt
    id: rotten_crt
    scanline_opacity: 0.0
    scanline_frequency_px: 1.7
    rgb_split_px: 0.0
    curvature: 0.0
    vignette: 0.0
    phosphor_mask: 0.0
    brightness_compensation: 1.0
  - type: downscale
    id: rotten_2x_downscale
    factor: 2.0
    opacity: 0.0
  - type: color_quantize
    id: rotten_128_color_quantize
    palette_size: 128
    dither_strength: 0.82
    opacity: 1.0
    luma_preserve: 0.72
    highlight_bias: 0.45
    gamma: 1.55
    seed: 1931
