kind: scene-fragment
schema_version: 1

entities:
- id: controls
  name: controls
  visible: true
  simulation_enabled: false
  collision_enabled: false
  components:
  - type: InputActionMap
    id: main-menu
    active: true
    actions:
      menu.up:
        kind: button
        pressed:
        - ArrowUp
        - KeyW
      menu.down:
        kind: button
        pressed:
        - ArrowDown
        - KeyS
      menu.confirm:
        kind: button
        pressed:
        - Enter
        - Space
      menu.any:
        kind: button
        pressed:
        - Enter
        - Space
        - ArrowUp
        - ArrowDown
        - ArrowLeft
        - ArrowRight
        - KeyW
        - KeyA
        - KeyS
        - KeyD
  - type: Behavior
    kind: menu_navigation_controller
    index_state: menu_index
    item_count: 3
    up_action: menu.up
    down_action: menu.down
    confirm_action: menu.confirm
    selected_color_prefix: menu_color
    selected_color: '#39D7FFFF'
    unselected_color: '#7D8796FF'
    confirm_events:
    - menu.start
    - menu.options
    - menu.quit
  - type: EventPipeline
    id: start-selected
    topic: menu.start
    steps:
    - kind: set_state
      key: menu_status
      value: START selected - first mission is not implemented yet
    - kind: set_state
      key: menu_status_color
      value: '#FFB000FF'
  - type: EventPipeline
    id: options-selected
    topic: menu.options
    steps:
    - kind: set_state
      key: menu_status
      value: OPTIONS not implemented yet
    - kind: set_state
      key: menu_status_color
      value: '#7D8796FF'
  - type: EventPipeline
    id: quit-selected
    topic: menu.quit
    steps:
    - kind: set_state
      key: menu_status
      value: QUIT is unavailable in editor preview
    - kind: set_state
      key: menu_status_color
      value: '#FF4D6DFF'

