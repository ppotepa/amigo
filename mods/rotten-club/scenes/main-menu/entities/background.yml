kind: scene-fragment
schema_version: 1

entities:
- id: main-menu-camera
  name: main-menu-camera
  tags:
  - camera
  visible: true
  simulation_enabled: true
  collision_enabled: false
  transform2:
    translation:
      x: 0.0
      y: 0.0
    rotation_degrees: 0.0
    scale:
      x: 1.05
      y: 1.05
  components:
  - type: Camera2D

- id: main-menu-background
  name: background
  tags:
  - background
  - layered-image
  visible: true
  simulation_enabled: false
  collision_enabled: false
  transform2:
    translation:
      x: 0.0
      y: 0.0
    rotation_degrees: 0.0
    scale:
      x: 1.0
      y: 1.0
  components:
  - type: LayeredImage2D
    render_layer: background.city
    asset: rotten-club/layered-images/neon-alley
    size:
      x: 1280.0
      y: 720.0
    base_opacity: 0.0
    viewport_fit: cover
    z_index: -100.0
    layer_overrides:
    - id: club_sign
      opacity: 0.0
    - id: club_sign_blur
      opacity: 0.0
    - id: bar_sign
      opacity: 0.0
    - id: bar_sign_blur
      opacity: 0.0
    - id: pharmacy_cross
      opacity: 0.0
    - id: pharmacy_cross_blur
      opacity: 0.0
    - id: bar_lanterns
      opacity: 0.0
    - id: bar_lanterns_blur
      opacity: 0.0
    - id: skyline
      opacity: 0.0
    - id: club_entry
      opacity: 0.0
    - id: skyline_blur
      opacity: 0.0
    - id: club_entry_blur
      opacity: 0.0
    - id: rain_relief_edges
      opacity: 0.0
  - type: GlobalLight2D
    id: lightning
    color: '#B8D8FFFF'
    intensity: 0.0
  - type: LightMap2DSource
    id: neon-alley-lightmap
    source:
      kind: layered_image_2d
      entity: background
    channels:
    - id: far_city
      layers:
      - skyline
      - skyline_blur
    - id: mid_neon
      layers:
      - club_sign
      - club_sign_blur
      - club_entry
      - club_entry_blur
      - pharmacy_cross
      - pharmacy_cross_blur
    - id: near_bar
      layers:
      - bar_sign
      - bar_sign_blur
      - bar_lanterns
      - bar_lanterns_blur

- id: beacon-a
  name: beacon-a
  visible: true
  simulation_enabled: false
  collision_enabled: false
  transform2:
    translation: { x: -132.0, y: 295.0 }
    rotation_degrees: 0.0
    scale: { x: 1.0, y: 1.0 }
  components:
  - type: BeaconLight2D
    id: beacon-a
    render_layer: background.city
    viewport_fit: cover
    viewport_canvas_size: { x: 1280.0, y: 720.0 }
    color: '#FF1F1FFF'
    base_intensity: 5.2
    frequency_hz: 0.24
    duty_cycle: 0.12
    rise_seconds: 0.10
    fall_seconds: 0.20
    phase_offset: 0.00
    jitter_amount: 0.10
    jitter_hz: 7.5
    core_radius_px: 4.2
    halo_radius_px: 34.0
    aberration_px: 2.6
    flare_length_px: 42.0
    flare_strength: 0.65
    z_index: 2000.0
