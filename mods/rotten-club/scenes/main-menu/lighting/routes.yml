kind: scene-fragment
schema_version: 1

visual2d:
  light_groups:
  - id: skyline
    label: Skyline
    color: "#9bb8ff"
    intensity: 1.0
    render_contributions:
      lighting.emit: true
      bloom.source: true
      camera.fx_source: true
    camera_response:
      enabled: true
      intensity: 0.30
      bloom: 0.22
      glare: 0.15
      ghosting: 0.04
      streaks: 0.03
      chromatic_smear: 0.05
      dirt_response: 0.15
      halation: 0.08
      threshold: 0.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: far_city
      response: 1.0
  - id: neon.mid
    label: Mid Neon
    color: "#ff66cc"
    intensity: 1.0
    render_contributions:
      lighting.emit: true
      bloom.source: true
      camera.fx_source: true
    camera_response:
      enabled: true
      intensity: 0.92
      bloom: 0.60
      glare: 0.54
      ghosting: 0.20
      streaks: 0.36
      chromatic_smear: 0.30
      dirt_response: 0.38
      halation: 0.24
      threshold: 0.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: mid_neon
      response: 1.0
  - id: bar
    label: Bar
    color: "#ffcc66"
    intensity: 1.0
    render_contributions:
      lighting.emit: true
      bloom.source: true
      camera.fx_source: true
    camera_response:
      enabled: true
      intensity: 0.65
      bloom: 0.50
      glare: 0.32
      ghosting: 0.10
      streaks: 0.14
      chromatic_smear: 0.08
      dirt_response: 0.32
      halation: 0.34
      threshold: 0.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: near_bar
      response: 1.0
  - id: lightning
    label: Lightning
    color: "#dbe8ff"
    intensity: 0.0
    sources:
    - kind: global_light
      id: lightning
      response: 1.0
  - id: beacon.red
    label: Beacon Red
    color: "#ff2a1e"
    intensity: 1.0
    sources:
    - kind: global_light
      id: beacon-red
      response: 1.0
  light_routes:
  - receiver_layer: weather.rain.10m
    groups: [skyline, neon.mid, beacon.red, lightning]
  - receiver_layer: weather.rain.5m
    groups: [bar, neon.mid, beacon.red, lightning]
  - receiver_layer: weather.rain.1m
    groups: [skyline, neon.mid, bar, beacon.red, lightning]
  - receiver_layer: weather.rain.super_near
    groups: [skyline, neon.mid, bar, beacon.red, lightning]
  - receiver_layer: ui
    groups: []
