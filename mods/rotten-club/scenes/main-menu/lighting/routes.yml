kind: scene-fragment
schema_version: 1

visual2d:
  light_groups:
  - id: skyline
    label: Skyline
    color: "#9bb8ff"
    intensity: 1.0
    render_contributions:
      lighting.emit: true
      bloom.source: true
      camera.fx_source: true
    camera_response:
      enabled: true
      intensity: 0.35
      bloom: 0.25
      glare: 0.18
      ghosting: 0.08
      streaks: 0.05
      chromatic_smear: 0.08
      dirt_response: 0.18
      halation: 0.10
      threshold: 0.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: far_city
      response: 1.0
  - id: neon.mid
    label: Mid Neon
    color: "#ff66cc"
    intensity: 1.0
    render_contributions:
      lighting.emit: true
      bloom.source: true
      camera.fx_source: true
    camera_response:
      enabled: true
      intensity: 0.85
      bloom: 0.55
      glare: 0.45
      ghosting: 0.22
      streaks: 0.30
      chromatic_smear: 0.25
      dirt_response: 0.35
      halation: 0.25
      threshold: 0.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: mid_neon
      response: 1.0
  - id: bar
    label: Bar
    color: "#ffcc66"
    intensity: 1.0
    render_contributions:
      lighting.emit: true
      bloom.source: true
      camera.fx_source: true
    camera_response:
      enabled: true
      intensity: 0.65
      bloom: 0.45
      glare: 0.35
      ghosting: 0.14
      streaks: 0.18
      chromatic_smear: 0.12
      dirt_response: 0.30
      halation: 0.28
      threshold: 0.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: near_bar
      response: 1.0
  - id: lightning
    label: Lightning
    color: "#dbe8ff"
    intensity: 0.0
    sources:
    - kind: global_light
      id: lightning
      response: 1.0
  - id: beacon.red
    label: Beacon Red
    color: "#ff2a1e"
    intensity: 1.0
    sources:
    - kind: global_light
      id: beacon-red
      response: 1.0
  light_routes:
  - receiver_layer: weather.rain.10m
    groups: [skyline, neon.mid, beacon.red, lightning]
  - receiver_layer: weather.rain.5m
    groups: [bar, neon.mid, beacon.red, lightning]
  - receiver_layer: weather.rain.1m
    groups: [skyline, neon.mid, bar, beacon.red, lightning]
  - receiver_layer: weather.rain.super_near
    groups: [skyline, neon.mid, bar, beacon.red, lightning]
  - receiver_layer: ui
    groups: []
