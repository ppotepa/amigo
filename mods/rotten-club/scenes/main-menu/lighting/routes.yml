kind: scene-fragment
schema_version: 1

visual2d:
  light_groups:
  - id: skyline
    label: Skyline
    color: "#9bb8ff"
    intensity: 1.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: far_city
      response: 1.0
  - id: neon.mid
    label: Mid Neon
    color: "#ff66cc"
    intensity: 1.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: mid_neon
      response: 1.0
  - id: bar
    label: Bar
    color: "#ffcc66"
    intensity: 1.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: near_bar
      response: 1.0
  - id: lightning
    label: Lightning
    color: "#dbe8ff"
    intensity: 0.0
    sources:
    - kind: global_light
      id: lightning
      response: 1.0
  - id: beacon.red
    label: Beacon Red
    color: "#ff2a1e"
    intensity: 1.0
    sources:
    - kind: global_light
      id: beacon-red
      response: 1.0
  light_routes:
  - receiver_layer: weather.rain.far
    groups: [skyline, beacon.red, lightning]
  - receiver_layer: weather.rain.mid
    groups: [neon.mid, beacon.red, lightning]
  - receiver_layer: weather.rain.near
    groups: [bar, neon.mid, beacon.red, lightning]
  - receiver_layer: weather.rain.front
    groups: [skyline, neon.mid, bar, beacon.red, lightning]
  - receiver_layer: ui
    groups: []
