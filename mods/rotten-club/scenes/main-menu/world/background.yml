kind: scene-fragment
schema_version: 1

entities:
- id: main-menu-background
  name: background
  tags:
  - background
  - layered-image
  - world
  visible: true
  simulation_enabled: false
  collision_enabled: false
  transform2:
    translation:
      x: 0.0
      y: 0.0
    rotation_degrees: 0.0
    scale:
      x: 1.0
      y: 1.0
  components:
  - type: LayeredImage2D
    render_layer: background.city
    asset: rotten-club/layered-images/neon-alley
    size:
      x: 1280.0
      y: 720.0
    base_opacity: 0.0
    viewport_fit: cover
    z_index: -100.0
    layer_overrides:
    - id: club_sign
      opacity: 0.0
    - id: bar_sign
      opacity: 0.0
    - id: pharmacy_cross
      opacity: 0.0
    - id: bar_lanterns
      opacity: 0.0
    - id: skyline
      opacity: 0.0
    - id: club_entry
      opacity: 0.0
    - id: rain_relief_edges
      opacity: 0.0
  - type: LightMap2DSource
    id: neon-alley-lightmap
    source:
      kind: layered_image_2d
      entity: background
    channels:
    - id: far_city
      layers:
      - skyline
    - id: mid_neon
      layers:
      - club_sign
      - club_entry
      - pharmacy_cross
    - id: near_bar
      layers:
      - bar_sign
      - bar_lanterns
