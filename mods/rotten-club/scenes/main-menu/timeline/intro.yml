kind: timeline-2d
schema_version: 1
id: main-menu-intro

clock:
  state_key: intro.t
  complete_state_key: intro.complete
  complete_at_s: 19.0

beats:
  - id: skyline
    start_s: 2.40
    duration_s: 2.20
    description: Fade in the distant skyline light layer.
  - id: far-street
    start_s: 5.00
    duration_s: 2.60
    description: Raise base alley visibility before foreground neon appears.
  - id: bar
    start_s: 5.60
    duration_s: 1.40
    description: Fade amber bar sign and lantern layers.
  - id: club
    start_s: 7.20
    duration_s: 1.60
    description: Fade club sign and club entry layers.
  - id: pharmacy
    start_s: 9.00
    duration_s: 1.30
    description: Fade the green pharmacy cross layer.
  - id: club-focus
    start_s: 10.00
    duration_s: 1.00
    description: Make the club sign the main visual anchor.
  - id: rain
    start_s: 11.00
    duration_s: 2.20
    description: Ramp rain emitters and rain relief edges.
  - id: lightning
    start_s: 14.20
    pulse:
      rise_s: 0.06
      hold_s: 0.10
      decay_s: 0.42
      value: 1.0
    description: Short flash that boosts rain and beacon intensity.
  - id: title-focus
    start_s: 15.00
    duration_s: 1.00
    description: Quiet beat after lightning before the title reveal.
  - id: title
    start_s: 17.00
    duration_s: 1.40
    description: Show title and subtitle.

tracks:
  - id: background.base.opacity
    control_path: world.background.city.LayeredImage2D.base_opacity
    curve:
      - { t: 0.0, value: 0.0 }
      - { t: 2.4, value: 0.0 }
      - { t: 5.0, value: 0.18, easing: smoothstep }
      - { t: 9.0, value: 0.31, easing: smoothstep }
      - { t: 14.2, value: 0.40, easing: smoothstep }
      - { t: 14.8, value: 0.31, easing: smoothstep }

  - id: background.skyline.opacity
    control_path: world.background.city.LayeredImage2D.layers.skyline.opacity
    curve:
      - { t: 0.0, value: 0.0 }
      - { t: 2.4, value: 0.0 }
      - { t: 4.6, value: 0.78, easing: smoothstep }
      - { t: 14.2, value: 0.92, easing: smoothstep }

  - id: background.club_sign.opacity
    control_path: world.background.city.LayeredImage2D.layers.club_sign.opacity
    curve:
      - { t: 0.0, value: 0.0 }
      - { t: 7.2, value: 0.0 }
      - { t: 8.8, value: 0.95, easing: smoothstep }
      - { t: 14.2, value: 1.0, easing: smoothstep }

  - id: background.club_entry.opacity
    control_path: world.background.city.LayeredImage2D.layers.club_entry.opacity
    curve:
      - { t: 0.0, value: 0.0 }
      - { t: 7.2, value: 0.0 }
      - { t: 8.8, value: 0.72, easing: smoothstep }
      - { t: 14.2, value: 0.92, easing: smoothstep }

  - id: background.bar_sign.opacity
    control_path: world.background.city.LayeredImage2D.layers.bar_sign.opacity
    curve:
      - { t: 0.0, value: 0.0 }
      - { t: 5.6, value: 0.0 }
      - { t: 7.0, value: 0.72, easing: smoothstep }
      - { t: 14.2, value: 0.90, easing: smoothstep }

  - id: background.bar_lanterns.opacity
    control_path: world.background.city.LayeredImage2D.layers.bar_lanterns.opacity
    curve:
      - { t: 0.0, value: 0.0 }
      - { t: 5.6, value: 0.0 }
      - { t: 7.0, value: 0.58, easing: smoothstep }
      - { t: 14.2, value: 0.80, easing: smoothstep }

  - id: background.pharmacy_cross.opacity
    control_path: world.background.city.LayeredImage2D.layers.pharmacy_cross.opacity
    curve:
      - { t: 0.0, value: 0.0 }
      - { t: 9.0, value: 0.0 }
      - { t: 10.3, value: 0.62, easing: smoothstep }

  - id: background.rain_relief_edges.opacity
    control_path: world.background.city.LayeredImage2D.layers.rain_relief_edges.opacity
    curve:
      - { t: 0.0, value: 0.0 }
      - { t: 11.0, value: 0.0 }
      - { t: 13.2, value: 0.24, easing: smoothstep }
      - { t: 14.2, value: 0.55, easing: smoothstep }
      - { t: 14.8, value: 0.24, easing: smoothstep }

  - id: rain.far.intensity
    control_path: world.weather.rain.far.ParticleEmitter2D.intensity
    state_key: intro.rain_intensity
    curve:
      - { t: 0.0, value: 0.0 }
      - { t: 11.0, value: 0.0 }
      - { t: 13.2, value: 0.48, easing: smoothstep }

  - id: rain.near.intensity
    control_path: world.weather.rain.near.ParticleEmitter2D.intensity
    curve:
      - { t: 0.0, value: 0.0 }
      - { t: 11.0, value: 0.0 }
      - { t: 13.2, value: 0.66, easing: smoothstep }

  - id: camera.focus_distance_m
    control_path: world.camera.main.Camera2D.aperture.focus_distance_m
    state_key: intro.camera_focus_distance_m
    curve:
      - { t: 0.0, value: 36.0 }
      - { t: 10.0, value: 36.0 }
      - { t: 11.0, value: 9.0, easing: smoothstep }
      - { t: 15.0, value: 9.0 }
      - { t: 16.0, value: 5.5, easing: smoothstep }

  - id: light_group.lightning.intensity
    control_path: world.light_group.lightning.LightGroup2D.intensity
    state_key: intro.lightning_intensity
    pulse:
      start_s: 14.2
      rise_s: 0.06
      hold_s: 0.10
      decay_s: 0.42
      value: 1.0

  - id: beacon.left.base_intensity
    control_path: world.lighting.beacon.left.Beacon2D.base_intensity
    curve:
      - { t: 0.0, value: 0.0 }
      - { t: 7.2, value: 0.0 }
      - { t: 8.8, value: 0.92, easing: smoothstep }
      - { t: 14.2, value: 1.35, easing: smoothstep }
      - { t: 14.8, value: 0.92, easing: smoothstep }

  - id: beacon.right.base_intensity
    control_path: world.lighting.beacon.right.Beacon2D.base_intensity
    curve:
      - { t: 0.0, value: 0.0 }
      - { t: 5.6, value: 0.0 }
      - { t: 7.0, value: 0.78, easing: smoothstep }
      - { t: 14.2, value: 1.22, easing: smoothstep }
      - { t: 14.8, value: 0.78, easing: smoothstep }

  - id: title.opacity
    control_path: world.title.depth2d.RenderLayer2D.opacity
    state_key: intro.title_alpha
    curve:
      - { t: 0.0, value: 0.0 }
      - { t: 17.0, value: 0.0 }
      - { t: 18.4, value: 1.0, easing: smoothstep }
