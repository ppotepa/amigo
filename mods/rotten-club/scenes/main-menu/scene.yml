version: 1
scene:
  id: main-menu
  label: Main Menu
  description: Native runtime UI main menu scene for Rotten Club.

use:
  scheduling:
    - ./scheduling.yml
  camera:
    - ./camera/main.yml
    - ./camera/motion.yml
    - ./camera/dof-controls.yml
  render:
    - ./render/layers.yml
  world:
    - ./world/background.yml
    - ./world/depth.yml
  lighting:
    - ./lighting/sources.yml
    - ./lighting/beacons.yml
    - ./lighting/routes.yml
  weather:
    - ./weather/rain-particles.yml
  interaction:
    - ./interaction/controls.yml
  ui:
    - ./ui/mount.yml
  input:
    - ./input/actions.yml
  events:
    - ./events/pipelines.yml
  state:
    - ./state/defaults.yml

script: ./scene.rhai
