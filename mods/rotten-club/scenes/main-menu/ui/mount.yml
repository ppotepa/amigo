kind: scene-fragment
schema_version: 1

entities:
  - id: themes
    name: themes
    visible: false
    simulation_enabled: false
    collision_enabled: false
    components:
      - type: UiThemeRef
        asset: mod:ui/themes/rotten-noir

  - id: main-menu-ui
    name: main-menu
    tags: [ui, menu, main-menu]
    visible: false
    simulation_enabled: false
    collision_enabled: false
    components:
      - type: UiDocumentRef
        asset: mod:ui/menus/main-menu
      - type: UiModelBindingsRef
        source: ./bindings.yml

  - id: main-menu-press-any-key
    name: press-any-key
    tags: [ui, menu, prompt]
    visible: false
    simulation_enabled: false
    collision_enabled: false
    components:
      - type: UiDocumentRef
        asset: ./prompt.yml
