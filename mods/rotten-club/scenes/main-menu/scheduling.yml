kind: scene-scheduling
schema_version: 1

scheduling:
  mode: hybrid
  strict: false
  allow_frame_latency: false
  overrides:
    - target: entity:rain-horizon/component:ParticleEmitter2D
      lane: simulation
      priority: background
      parallelism: per_emitter
      allow_frame_latency: true
      quality_scale: 0.25
      budget_ms: 0.35
    - target: entity:rain-far/component:ParticleEmitter2D
      lane: simulation
      priority: background
      parallelism: per_emitter
      allow_frame_latency: true
      quality_scale: 0.3
      budget_ms: 0.45
    - target: entity:rain-mid-far/component:ParticleEmitter2D
      lane: simulation
      priority: background
      parallelism: per_emitter
      allow_frame_latency: true
      quality_scale: 0.4
      budget_ms: 0.55
    - target: entity:rain-mid/component:ParticleEmitter2D
      lane: simulation
      priority: normal
      parallelism: per_emitter
      allow_frame_latency: true
      quality_scale: 0.55
      budget_ms: 0.75
    - target: entity:rain-street/component:ParticleEmitter2D
      lane: simulation
      priority: normal
      parallelism: per_emitter
      allow_frame_latency: true
      quality_scale: 0.7
      budget_ms: 0.85
    - target: entity:rain-near/component:ParticleEmitter2D
      lane: simulation
      priority: foreground
      parallelism: per_emitter
      allow_frame_latency: false
      quality_scale: 0.8
