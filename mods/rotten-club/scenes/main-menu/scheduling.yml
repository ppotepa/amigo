      budget_ms: 0.9
    - target: entity:rain-front/component:ParticleEmitter2D
      lane: simulation
      priority: foreground
      parallelism: per_emitter
      allow_frame_latency: false
      quality_scale: 1.0
      budget_ms: 0.85
    - target: entity:rain-lens/component:ParticleEmitter2D
      lane: simulation
      priority: foreground
      parallelism: per_emitter
      allow_frame_latency: false
      quality_scale: 1.0
      budget_ms: 0.65
    - target: entity:rain-micro/component:ParticleEmitter2D
      lane: simulation
      priority: foreground
      parallelism: per_emitter
      allow_frame_latency: false
      quality_scale: 1.0
      budget_ms: 0.5
    - target: render:particles2d
      lane: render_prepare
      priority: normal
      parallelism: per_layer
