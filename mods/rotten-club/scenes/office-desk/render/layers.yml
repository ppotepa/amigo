kind: scene-fragment
schema_version: 1

visual2d:
  spatial:
    depth_space:
      near_m: 0.5
      far_m: 120.0
      curve: logarithmic

  render_layers:
    - id: background.room
      label: Background Room
      order: -100.0
      visible: true
      opacity: 0.82
      optical_role: world_surface
      depth:
        mode: depth_map

    - id: lighting.beacons
      label: Single Point Light
      order: -10.0
      visible: true
      opacity: 0.0
      optical_role: scene_medium
      depth:
        mode: overlay
        distance_m: 1.2
        blur_scale: 0.55

    - id: ui.overlay
      label: UI Overlay
      order: 1000.0
      visible: true
      opacity: 1.0
      optical_role: overlay
      depth:
        mode: overlay
