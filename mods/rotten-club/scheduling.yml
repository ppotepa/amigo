kind: mod-scheduling
schema_version: 1

scheduling:
  mode: hybrid
  strict: false
  max_workers: 3
  allow_frame_latency: false

  frame_clock:
    strategy: host_realtime
    simulation_fps: 60.0
    render_fps: 60.0
    max_catch_up_ticks: 1
    clamp_frame_delta_seconds: 0.05

    presentation:
      cache_game_frame: false
      hold_last_game_frame: false
      game_ui: cached
      devtools: cached
      editor: cached
      debug_overlay: cached
