id = "rotten-club"
name = "Rotten Club"
version = "0.1.0"
description = "Noir tactical top-down shooter project."
authors = ["Amigo Engine Team"]
dependencies = ["core"]
capabilities = ["rendering_2d", "text_2d", "vector_2d", "screen_space_ui"]
launcher_category = ["2D", "Games", "Rotten Club"]

[scripting]
mod_script_mode = "disabled"

[[scenes]]
id = "start"
label = "Start"
description = "Initial placeholder scene for the Rotten Club project."
path = "scenes/start"
launcher_visible = false

[[scenes]]
id = "main-menu"
label = "Main Menu"
description = "Native runtime UI main menu scene for Rotten Club."
path = "scenes/main-menu"
launcher_visible = true
