id = "rotten-club"
name = "Rotten Club"
version = "0.1.0"
description = "Clean-room Rotten Club main menu on the current plugin-owned scene architecture."
authors = ["Amigo Engine Team"]
dependencies = ["core"]
capabilities = [
  "rendering_2d",
  "camera_2d",
  "focus_depth_2d",
  "layered_image_2d",
  "text_2d",
  "light_2d",
  "beacon_light_2d",
  "particles_2d"
]
launcher_category = ["2D", "Games", "Rotten Club"]

[scripting]
mod_script_mode = "disabled"

[[scenes]]
id = "main-menu"
label = "Main Menu"
description = "Plugin-owned Rotten Club scene with authored timeline tracks and a small Rhai lifecycle director."
path = "scenes/main-menu"
launcher_visible = true

[[scenes]]
id = "main-menu2"
label = "Main Menu 2 Light Pass Assembly"
description = "Rotten Club scene variant assembled from the main-menu2 signed lightmap pass assets."
path = "scenes/main-menu2"
launcher_visible = true
