kind: ui-main-menu
schema_version: 1
id: main-menu
label: 'Main Menu'
target:
  type: screen-space
  layer: menu
  viewport:
    width: 1280.0
    height: 720.0
    scaling: fit
root:
  type: column
  id: root
  style_class: root
  style:
    left: 0.0
    top: 0.0
    width: 1280.0
    height: 720.0
    padding: 0.0
    gap: 14.0
    background: '#050812FF'
  children:
    - type: spacer
      id: top-space
      style:
        width: 1280.0
        height: 76.0
    - type: text
      id: case-file
      text: 'CASE FILE: INTERNAL AFFAIRS / NIGHT SHIFT'
      font: fonts/debug-ui
      style_class: text-muted
      style:
        width: 1280.0
        height: 28.0
        font_size: 15.0
        color: '#7D8796FF'
        align: center
    - type: text
      id: title
      text: 'THEY ARE ROTTEN'
      font: fonts/debug-ui
      style_class: text-title
      style:
        width: 1280.0
        height: 74.0
        font_size: 58.0
        color: '#EAF6FFFF'
        align: center
    - type: text
      id: subtitle
      text: 'A corrupt city. A rotten badge. A clean shot is never clean.'
      font: fonts/debug-ui
      style_class: text-muted
      style:
        width: 1280.0
        height: 34.0
        font_size: 17.0
        color: '#89A2B7FF'
        align: center
    - type: spacer
      id: title-menu-gap
      style:
        width: 1280.0
        height: 26.0
    - type: panel
      id: menu-card
      style_class: panel
      style:
        left: 420.0
        width: 440.0
        height: 246.0
        padding: 20.0
        gap: 12.0
        background: '#101827EE'
        border_color: '#2A6F9EFF'
        border_width: 1.0
        border_radius: 10.0
      children:
        - type: text
          id: menu-title
          text: 'MAIN MENU'
          font: fonts/debug-ui
          style_class: text-muted
          style:
            width: 400.0
            height: 28.0
            font_size: 15.0
            color: '#7D8796FF'
            align: center
        - type: button
          id: start
          text: 'START'
          font: fonts/debug-ui
          style_class: button-secondary
          style:
            width: 400.0
            height: 48.0
            font_size: 20.0
            color: '#39D7FFFF'
            background: '#172033EE'
            border_color: '#2A6F9EFF'
            border_width: 1.0
            border_radius: 8.0
            align: center
          on_click:
            event: they-are-rotten.menu.start
        - type: button
          id: options
          text: 'OPTIONS'
          font: fonts/debug-ui
          style_class: button-secondary
          style:
            width: 400.0
            height: 48.0
            font_size: 20.0
            color: '#7D8796FF'
            background: '#172033EE'
            border_color: '#2A6F9EFF'
            border_width: 1.0
            border_radius: 8.0
            align: center
          on_click:
            event: they-are-rotten.menu.options
        - type: button
          id: quit
          text: 'QUIT'
          font: fonts/debug-ui
          style_class: button-secondary
          style:
            width: 400.0
            height: 48.0
            font_size: 20.0
            color: '#7D8796FF'
            background: '#172033EE'
            border_color: '#2A6F9EFF'
            border_width: 1.0
            border_radius: 8.0
            align: center
          on_click:
            event: they-are-rotten.menu.quit
    - type: text
      id: status
      text: 'READY'
      font: fonts/debug-ui
      style_class: text-muted
      style:
        width: 1280.0
        height: 32.0
        font_size: 15.0
        color: '#7D8796FF'
        align: center
