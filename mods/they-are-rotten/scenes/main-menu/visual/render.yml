kind: scene-fragment
schema_version: 1

visual2d:
  render_layers:
  - id: background.city
    label: Background City
    order: -100.0
    visible: true
    opacity: 1.0
  - id: weather.rain.far
    label: Far Rain
    order: -18.0
    visible: true
    opacity: 1.0
  - id: weather.rain.mid
    label: Mid Rain
    order: -16.0
    visible: true
    opacity: 1.0
  - id: weather.rain.near
    label: Near Rain
    order: -14.0
    visible: true
    opacity: 1.0
  - id: ui
    label: UI
    order: 1000.0
    visible: true
    opacity: 1.0
  light_groups:
  - id: skyline
    label: Skyline
    color: "#9bb8ff"
    intensity: 1.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: far_city
      response: 1.0
  - id: neon.mid
    label: Mid Neon
    color: "#ff66cc"
    intensity: 1.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: mid_neon
      response: 1.0
  - id: bar
    label: Bar
    color: "#ffcc66"
    intensity: 1.0
    sources:
    - kind: lightmap_channel
      source: neon-alley-lightmap
      channel: near_bar
      response: 1.0
  - id: lightning
    label: Lightning
    color: "#dbe8ff"
    intensity: 0.0
    sources:
    - kind: global_light
      id: lightning
      response: 1.0
  light_routes:
  - receiver_layer: weather.rain.far
    groups: [skyline, lightning]
  - receiver_layer: weather.rain.mid
    groups: [neon.mid, lightning]
  - receiver_layer: weather.rain.near
    groups: [bar, neon.mid, lightning]
  - receiver_layer: ui
    groups: []
  post_fx:
  - type: film_noise
    id: rotten_film_noise
    intensity: 0.22
    scale: 220.0
    speed: 18.0
    opacity: 0.32
    seed: 7319
  - type: wet_reflections
    id: neon-alley-wet-ground
    enabled: true
    masks:
      reflection: they-are-rotten/layered-images/neon-alley/reflection_mask_blur.png
      reflection_invert: true
      edges: they-are-rotten/layered-images/neon-alley/edge_map_2.png
    surface:
      blur_px: 1.2
      distortion_px: 0.6
      shimmer_strength: 0.025
      ripple_strength: 0.015
      wet_darken: 0.04
      specular_boost: 0.18
    light_response:
      source: scene_color
      strength: 0.45
      edge_power: 1.5
    perspective:
      horizon_y: 0.42
      foreground_strength: 1.0
      background_strength: 0.08
    animation:
      noise_scale: 2.5
      noise_speed: 0.035
      ripple_speed: 0.08

