version: 1
scene:
  id: main-menu
  label: Main Menu
  description: Native runtime UI main menu scene for They Are Rotten.
entities:
- id: controls
  name: they-are-rotten-main-menu-controls
  visible: false
  simulation_enabled: false
  collision_enabled: false
  components:
  - type: InputActionMap
    id: main-menu
    active: true
    actions:
      menu.up:
        kind: button
        pressed:
        - ArrowUp
        - KeyW
      menu.down:
        kind: button
        pressed:
        - ArrowDown
        - KeyS
      menu.confirm:
        kind: button
        pressed:
        - Enter
        - Space
  - type: Behavior
    kind: menu_navigation_controller
    index_state: menu_index
    item_count: 3
    up_action: menu.up
    down_action: menu.down
    confirm_action: menu.confirm
    selected_color_prefix: menu_color
    selected_color: '#39D7FFFF'
    unselected_color: '#7D8796FF'
    confirm_events:
    - they-are-rotten.menu.start
    - they-are-rotten.menu.options
    - they-are-rotten.menu.quit
  - type: EventPipeline
    id: start-selected
    topic: they-are-rotten.menu.start
    steps:
    - kind: set_state
      key: menu_status
      value: START selected - first mission is not implemented yet
    - kind: set_state
      key: menu_status_color
      value: '#FFB000FF'
  - type: EventPipeline
    id: options-selected
    topic: they-are-rotten.menu.options
    steps:
    - kind: set_state
      key: menu_status
      value: OPTIONS not implemented yet
    - kind: set_state
      key: menu_status_color
      value: '#7D8796FF'
  - type: EventPipeline
    id: quit-selected
    topic: they-are-rotten.menu.quit
    steps:
    - kind: set_state
      key: menu_status
      value: QUIT is unavailable in editor preview
    - kind: set_state
      key: menu_status_color
      value: '#FF4D6DFF'
- id: themes
  name: they-are-rotten-main-menu-themes
  visible: false
  simulation_enabled: false
  collision_enabled: false
  components:
  - type: UiThemeSet
    active: rotten_noir
    themes:
    - id: rotten_noir
      palette:
        background: '#050812FF'
        surface: '#101827EE'
        surface_alt: '#172033EE'
        text: '#EAF6FFFF'
        text_muted: '#7D8796FF'
        border: '#2A6F9EFF'
        accent: '#39D7FFFF'
        accent_text: '#001018FF'
        danger: '#FF4D6DFF'
        warning: '#FFB000FF'
        success: '#5CFF9CFF'
- id: main-menu-ui
  name: they-are-rotten-main-menu
  tags:
  - ui
  - menu
  - main-menu
  visible: true
  simulation_enabled: false
  collision_enabled: false
  components:
  - type: UiDocument
    target:
      type: screen-space
      layer: menu
      viewport:
        width: 1280.0
        height: 720.0
        scaling: fit
    root:
      type: column
      id: root
      style_class: root
      style:
        left: 0.0
        top: 0.0
        width: 1280.0
        height: 720.0
        padding: 0.0
        gap: 14.0
        background: '#050812FF'
      children:
      - type: spacer
        id: top-space
        style:
          width: 1280.0
          height: 76.0
      - type: text
        id: case-file
        text: 'CASE FILE: INTERNAL AFFAIRS / NIGHT SHIFT'
        font: they-are-rotten/fonts/debug-ui
        style_class: text_muted
        style:
          width: 1280.0
          height: 28.0
          font_size: 15.0
          color: '#7D8796FF'
          align: center
      - type: text
        id: title
        text: THEY ARE ROTTEN
        font: they-are-rotten/fonts/debug-ui
        style_class: text_title
        style:
          width: 1280.0
          height: 74.0
          font_size: 58.0
          color: '#EAF6FFFF'
          align: center
      - type: text
        id: subtitle
        text: |-
          Rain can blur my blood, but it can’t erase it.
          Whichever way I turn, I step into another nest.
          So I remind the rats where they belong: in the dirt.
        font: they-are-rotten/fonts/debug-ui
        style_class: text_muted
        style:
          width: 1280.0
          height: 72.0
          font_size: 16.0
          color: '#89A2B7FF'
          align: center
      - type: spacer
        id: title-menu-gap
        style:
          width: 1280.0
          height: 26.0
      - type: panel
        id: menu-card
        style_class: panel
        style:
          left: 420.0
          width: 440.0
          height: 246.0
          padding: 20.0
          gap: 12.0
          background: '#101827EE'
          border_color: '#2A6F9EFF'
          border_width: 1.0
          border_radius: 10.0
        children:
        - type: text
          id: menu-title
          text: MAIN MENU
          font: they-are-rotten/fonts/debug-ui
          style_class: text_muted
          style:
            width: 400.0
            height: 28.0
            font_size: 15.0
            color: '#7D8796FF'
            align: center
        - type: button
          id: start
          text: START
          font: they-are-rotten/fonts/debug-ui
          style_class: button_secondary
          style:
            width: 400.0
            height: 48.0
            font_size: 20.0
            color: '#39D7FFFF'
            background: '#172033EE'
            border_color: '#2A6F9EFF'
            border_width: 1.0
            border_radius: 8.0
            align: center
          on_click:
            event: they-are-rotten.menu.start
        - type: button
          id: options
          text: OPTIONS
          font: they-are-rotten/fonts/debug-ui
          style_class: button_secondary
          style:
            width: 400.0
            height: 48.0
            font_size: 20.0
            color: '#7D8796FF'
            background: '#172033EE'
            border_color: '#2A6F9EFF'
            border_width: 1.0
            border_radius: 8.0
            align: center
          on_click:
            event: they-are-rotten.menu.options
        - type: button
          id: quit
          text: QUIT
          font: they-are-rotten/fonts/debug-ui
          style_class: button_secondary
          style:
            width: 400.0
            height: 48.0
            font_size: 20.0
            color: '#7D8796FF'
            background: '#172033EE'
            border_color: '#2A6F9EFF'
            border_width: 1.0
            border_radius: 8.0
            align: center
          on_click:
            event: they-are-rotten.menu.quit
      - type: text
        id: status
        text: READY
        font: they-are-rotten/fonts/debug-ui
        style_class: text_muted
        style:
          width: 1280.0
          height: 32.0
          font_size: 15.0
          color: '#7D8796FF'
          align: center
      - type: spacer
        id: bottom-fill
        style:
          width: 1280.0
          height: 88.0
      - type: text
        id: controls-hint
        text: W/S or Arrow Keys to move    Enter/Space to confirm    Mouse click works
        font: they-are-rotten/fonts/debug-ui
        style_class: debug_text
        style:
          width: 1280.0
          height: 28.0
          font_size: 14.0
          color: '#526170FF'
          align: center
  - type: UiModelBindings
    bindings:
    - path: they-are-rotten-main-menu.root.menu-card.start
      state: menu_color.0
      kind: color
    - path: they-are-rotten-main-menu.root.menu-card.options
      state: menu_color.1
      kind: color
    - path: they-are-rotten-main-menu.root.menu-card.quit
      state: menu_color.2
      kind: color
    - path: they-are-rotten-main-menu.root.status
      state: menu_status
      kind: text
    - path: they-are-rotten-main-menu.root.status
      state: menu_status_color
      kind: color
- id: main-ui
  name: Main UI
  visible: true
  simulation_enabled: false
  collision_enabled: false
  components:
  - type: UiDocument
    target:
      type: screen-space
      layer: menu
      viewport:
        width: 1280.0
        height: 720.0
        scaling: fit
    root:
      type: column
      id: root
      style:
        width: 1280.0
        height: 720.0
        padding: 0.0
        gap: 12.0
      children: []
