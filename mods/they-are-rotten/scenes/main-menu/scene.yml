version: 1
scene:
  id: main-menu
  label: Main Menu
  description: Native runtime UI main menu scene for They Are Rotten.
entities:
- id: controls
  name: they-are-rotten-main-menu-controls
  visible: true
  simulation_enabled: false
  collision_enabled: false
  components:
  - type: InputActionMap
    id: main-menu
    active: true
    actions:
      menu.up:
        kind: button
        pressed:
        - ArrowUp
        - KeyW
      menu.down:
        kind: button
        pressed:
        - ArrowDown
        - KeyS
      menu.confirm:
        kind: button
        pressed:
        - Enter
        - Space
      menu.any:
        kind: button
        pressed:
        - Enter
        - Space
        - ArrowUp
        - ArrowDown
        - ArrowLeft
        - ArrowRight
        - KeyW
        - KeyA
        - KeyS
        - KeyD
  - type: Behavior
    kind: menu_navigation_controller
    index_state: menu_index
    item_count: 3
    up_action: menu.up
    down_action: menu.down
    confirm_action: menu.confirm
    selected_color_prefix: menu_color
    selected_color: '#39D7FFFF'
    unselected_color: '#7D8796FF'
    confirm_events:
    - they-are-rotten.menu.start
    - they-are-rotten.menu.options
    - they-are-rotten.menu.quit
  - type: EventPipeline
    id: start-selected
    topic: they-are-rotten.menu.start
    steps:
    - kind: set_state
      key: menu_status
      value: START selected - first mission is not implemented yet
    - kind: set_state
      key: menu_status_color
      value: '#FFB000FF'
  - type: EventPipeline
    id: options-selected
    topic: they-are-rotten.menu.options
    steps:
    - kind: set_state
      key: menu_status
      value: OPTIONS not implemented yet
    - kind: set_state
      key: menu_status_color
      value: '#7D8796FF'
  - type: EventPipeline
    id: quit-selected
    topic: they-are-rotten.menu.quit
    steps:
    - kind: set_state
      key: menu_status
      value: QUIT is unavailable in editor preview
    - kind: set_state
      key: menu_status_color
      value: '#FF4D6DFF'
- id: themes
  name: they-are-rotten-main-menu-themes
  visible: false
  simulation_enabled: false
  collision_enabled: false
  components:
  - type: UiThemeSet
    active: rotten_noir
    themes:
    - id: rotten_noir
      palette:
        background: '#050812FF'
        surface: '#101827EE'
        surface_alt: '#172033EE'
        text: '#EAF6FFFF'
        text_muted: '#7D8796FF'
        border: '#2A6F9EFF'
        accent: '#39D7FFFF'
        accent_text: '#001018FF'
        danger: '#FF4D6DFF'
        warning: '#FFB000FF'
        success: '#5CFF9CFF'
- id: main-menu-background
  name: they-are-rotten-main-menu-background
  tags:
  - background
  - layered-image
  visible: true
  simulation_enabled: false
  collision_enabled: false
  transform2:
    translation:
      x: 0.0
      y: 0.0
    rotation_degrees: 0.0
    scale:
      x: 1.0
      y: 1.0
  components:
  - type: LayeredImage2D
    asset: they-are-rotten/layered-images/neon-alley
    size:
      x: 1280.0
      y: 720.0
    base_opacity: 0.0
    viewport_fit: cover
    z_index: -100.0
    layer_overrides:
    - id: club_sign
      opacity: 0.0
    - id: club_sign_blur
      opacity: 0.0
    - id: bar_sign
      opacity: 0.0
    - id: bar_sign_blur
      opacity: 0.0
    - id: pharmacy_cross
      opacity: 0.0
    - id: pharmacy_cross_blur
      opacity: 0.0
    - id: bar_lanterns
      opacity: 0.0
    - id: bar_lanterns_blur
      opacity: 0.0
    - id: skyline
      opacity: 0.0
    - id: aircraft_beacons
      opacity: 0.0
    - id: aircraft_beacons_blur
      opacity: 0.0
    - id: club_entry
      opacity: 0.0
    - id: skyline_blur
      opacity: 0.0
    - id: club_entry_blur
      opacity: 0.0
  - type: GlobalLight2D
    id: lightning
    color: '#B8D8FFFF'
    intensity: 0.0
  - type: LightMap2DSource
    id: neon-alley-lightmap
    source:
      kind: layered_image_2d
      entity: they-are-rotten-main-menu-background
    channels:
    - id: far_city
      layers:
      - skyline
      - skyline_blur
      - aircraft_beacons
      - aircraft_beacons_blur
    - id: mid_neon
      layers:
      - club_sign
      - club_sign_blur
      - club_entry
      - club_entry_blur
      - pharmacy_cross
      - pharmacy_cross_blur
    - id: near_bar
      layers:
      - bar_sign
      - bar_sign_blur
      - bar_lanterns
      - bar_lanterns_blur
- id: main-menu-rain-far
  name: they-are-rotten-main-menu-rain-far
  tags:
  - background
  - weather
  - rain
  - particles
  visible: true
  simulation_enabled: true
  collision_enabled: false
  transform2:
    translation:
      x: 0.0
      y: 270.0
    rotation_degrees: 0.0
    scale:
      x: 1.0
      y: 1.0
  components:
  - type: ParticleEmitter2D
    local_direction_degrees: -83.0
    active: true
    spawn_rate: 1450.0
    max_particles: 2600
    particle_lifetime: 2.8
    lifetime_jitter: 0.36
    initial_speed: 190.0
    speed_jitter: 52.0
    spread_degrees: 4.0
    velocity_mode: free
    simulation_space: world
    initial_size: 0.38
    final_size: 0.24
    color: '#FFFFFF24'
    color_ramp:
      interpolation: linear_rgb
      stops:
      - t: 0.0
        color: '#FFFFFF22'
      - t: 0.58
        color: '#FFFFFF1C'
      - t: 1.0
        color: '#FFFFFF00'
    spawn_area:
      kind: rect
      size:
        x: 1320.0
        y: 260.0
    z_index: -18.0
    shape:
      kind: line
      length: 3.0
    line_anchor: center
    align: velocity
    blend_mode: screen
    motion_stretch:
      enabled: true
      velocity_scale: 0.004
      max_length: 5.0
    material:
      receives_light: true
      light_response: 1.35
      lightmap:
        source: neon-alley-lightmap
        channel: far_city
        sample_strategy: line
        sample_points: 5
        radius_px: 24.0
        exposure: 1.65
        dark_policy: transparent
        global_lights:
        - id: lightning
          response: 1.45
    alpha_curve:
      kind: custom
      points:
      - t: 0.0
        value: 0.0
      - t: 0.12
        value: 0.18
      - t: 0.82
        value: 0.12
      - t: 1.0
        value: 0.0
    speed_curve:
      kind: constant
      value: 1.0
    forces:
    - kind: wind
      velocity:
        x: 88.0
        y: -300.0
      strength: 0.18
