- id: main-menu-ui
  name: they-are-rotten-main-menu
  tags:
  - ui
  - menu
  - main-menu
  visible: false
  simulation_enabled: false
  collision_enabled: false
  components:
  - type: UiDocument
    target:
      type: screen-space
      layer: menu
      viewport:
        width: 1280.0
        height: 720.0
        scaling: fit
    root:
      type: column
      id: root
      style_class: root
      style:
        left: 0.0
        top: 0.0
        width: 1280.0
        height: 720.0
        padding: 0.0
        gap: 14.0
        background: '#05081288'
      children:
      - type: spacer
        id: top-space
        style:
          width: 1280.0
          height: 76.0
      - type: text
        id: case-file
        text: 'CASE FILE: INTERNAL AFFAIRS / NIGHT SHIFT'
        font: they-are-rotten/fonts/debug-ui
        style_class: text_muted
        style:
          width: 1280.0
          height: 28.0
          font_size: 15.0
          color: '#7D8796FF'
          align: center
      - type: text
        id: title
        text: THEY ARE ROTTEN
        font: they-are-rotten/fonts/debug-ui
        style_class: text_title
        style:
          width: 1280.0
          height: 74.0
          font_size: 58.0
          color: '#EAF6FFFF'
          align: center
      - type: text
        id: subtitle
        text: |-
          Rain can blur my blood, but it can’t erase it.
          Whichever way I turn, I step into another nest.
          So I remind the rats where they belong: in the dirt.
        font: they-are-rotten/fonts/debug-ui
        style_class: text_muted
        style:
          width: 1280.0
          height: 72.0
          font_size: 16.0
          color: '#89A2B7FF'
          align: center
      - type: spacer
        id: title-menu-gap
        style:
          width: 1280.0
          height: 26.0
      - type: panel
        id: menu-card
        style_class: panel
        style:
          left: 420.0
          width: 440.0
          height: 246.0
          padding: 20.0
          gap: 12.0
          background: '#101827EE'
          border_color: '#2A6F9EFF'
          border_width: 1.0
          border_radius: 10.0
        children:
        - type: text
          id: menu-title
          text: MAIN MENU
          font: they-are-rotten/fonts/debug-ui
          style_class: text_muted
          style:
            width: 400.0
            height: 28.0
            font_size: 15.0
            color: '#7D8796FF'
            align: center
        - type: button
          id: start
          text: START
          font: they-are-rotten/fonts/debug-ui
          style_class: button_secondary
          style:
            width: 400.0
            height: 48.0
            font_size: 20.0
            color: '#39D7FFFF'
            background: '#172033EE'
            border_color: '#2A6F9EFF'
            border_width: 1.0
            border_radius: 8.0
            align: center
          on_click:
            event: they-are-rotten.menu.start
        - type: button
          id: options
          text: OPTIONS
          font: they-are-rotten/fonts/debug-ui
          style_class: button_secondary
          style:
            width: 400.0
            height: 48.0
            font_size: 20.0
            color: '#7D8796FF'
            background: '#172033EE'
            border_color: '#2A6F9EFF'
            border_width: 1.0
            border_radius: 8.0
            align: center
          on_click:
            event: they-are-rotten.menu.options
        - type: button
          id: quit
          text: QUIT
          font: they-are-rotten/fonts/debug-ui
          style_class: button_secondary
          style:
            width: 400.0
            height: 48.0
            font_size: 20.0
            color: '#7D8796FF'
            background: '#172033EE'
            border_color: '#2A6F9EFF'
            border_width: 1.0
            border_radius: 8.0
            align: center
          on_click:
            event: they-are-rotten.menu.quit
      - type: text
        id: status
        text: READY
        font: they-are-rotten/fonts/debug-ui
        style_class: text_muted
        style:
          width: 1280.0
          height: 32.0
          font_size: 15.0
          color: '#7D8796FF'
          align: center
      - type: spacer
        id: bottom-fill
        style:
          width: 1280.0
          height: 88.0
      - type: text
        id: controls-hint
        text: W/S or Arrow Keys to move    Enter/Space to confirm    Mouse click works
        font: they-are-rotten/fonts/debug-ui
        style_class: debug_text
        style:
          width: 1280.0
          height: 28.0
          font_size: 14.0
          color: '#526170FF'
          align: center
  - type: UiModelBindings
    bindings:
    - path: they-are-rotten-main-menu.root.menu-card.start
      state: menu_color.0
      kind: color
    - path: they-are-rotten-main-menu.root.menu-card.options
      state: menu_color.1
      kind: color
    - path: they-are-rotten-main-menu.root.menu-card.quit
      state: menu_color.2
      kind: color
    - path: they-are-rotten-main-menu.root.status
      state: menu_status
      kind: text
    - path: they-are-rotten-main-menu.root.status
      state: menu_status_color
      kind: color
