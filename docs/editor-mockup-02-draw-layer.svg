<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Amigo editor mockup 02 - Draw Layer selected</title>
  <desc id="desc">Render Stack selection drives Draw Layer inspector controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111317"/>
      <stop offset="0.58" stop-color="#1e2118"/>
      <stop offset="1" stop-color="#14100c"/>
    </linearGradient>
    <style>
      .mono { font-family: "Cascadia Mono", "Consolas", monospace; }
      .title { font-size: 20px; font-weight: 700; fill: #f5e7c0; }
      .small { font-size: 13px; fill: #c8ba91; }
      .tiny { font-size: 11px; fill: #92886f; }
      .panel { fill: #171b1b; stroke: #5b704d; stroke-width: 1.4; rx: 14; }
      .panel2 { fill: #15130f; stroke: #76623a; stroke-width: 1.2; rx: 12; }
      .row { fill: #202622; rx: 6; }
      .selected { fill: #343421; stroke: #efc75e; stroke-width: 1.7; rx: 7; }
      .live { fill: #83de90; font-size: 11px; }
      .readonly { fill: #a79a76; font-size: 11px; }
      .accent { fill: #efc75e; }
      .line { stroke: #3c4036; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="36" y="42" class="mono title">AMIGO INGAME EDITOR - Render Stack jako osobny dok</text>
  <text x="36" y="66" class="mono small">Use case: klik Draw Layer w dolnym panelu, inspector pokazuje live opacity / visible / order</text>

  <rect x="28" y="92" width="320" height="750" class="panel"/>
  <text x="48" y="126" class="mono title">SCENE OBJECTS</text>
  <text x="48" y="154" class="mono tiny">Draw Layers are not mixed into object tree</text>
  <rect x="44" y="186" width="280" height="30" class="row"/>
  <text x="58" y="206" class="mono small">- [SCN] main-menu</text>
  <rect x="44" y="222" width="280" height="30" class="row"/>
  <text x="72" y="242" class="mono small">- [ENT] Scene Objects</text>
  <rect x="44" y="258" width="280" height="30" class="row"/>
  <text x="88" y="278" class="mono small">  [OBJ] Club Sign</text>
  <rect x="44" y="294" width="280" height="30" class="row"/>
  <text x="88" y="314" class="mono small">  [OBJ] Bartender</text>
  <rect x="44" y="330" width="280" height="30" class="row"/>
  <text x="88" y="350" class="mono small">  [OBJ] Smoke Layer</text>

  <rect x="372" y="92" width="650" height="750" class="panel2"/>
  <text x="396" y="126" class="mono title">GAME VIEW</text>
  <rect x="420" y="160" width="558" height="315" fill="#0b1215" stroke="#efc75e" stroke-width="2" rx="8"/>
  <rect x="438" y="390" width="520" height="42" fill="#efc75e" opacity="0.18"/>
  <text x="456" y="418" class="mono small">foreground.signs layer highlight</text>
  <text x="436" y="520" class="mono small">Draw Layer controls affect routing/order/visibility, not component ownership.</text>
  <text x="436" y="544" class="mono tiny">Entity owns components. Draw Layer groups render order only.</text>

  <rect x="1046" y="92" width="366" height="470" class="panel"/>
  <text x="1068" y="126" class="mono title">INSPECTOR / PROPERTIES</text>
  <text x="1068" y="152" class="mono small">[LYR] foreground.signs [DrawLayer][Edit]</text>
  <line x1="1068" y1="168" x2="1388" y2="168" class="line"/>
  <text x="1068" y="196" class="mono small">Metadata</text>
  <text x="1086" y="222" class="mono tiny">Id: foreground.signs <tspan class="readonly">[Readonly]</tspan></text>
  <text x="1086" y="246" class="mono tiny">Label: Foreground Signs <tspan class="readonly">[Readonly]</tspan></text>
  <text x="1068" y="284" class="mono small">Render</text>
  <rect x="1084" y="304" width="286" height="12" fill="#314a32" rx="6"/>
  <rect x="1084" y="304" width="206" height="12" class="accent" rx="6"/>
  <text x="1086" y="338" class="mono tiny">Opacity = 72.0% <tspan class="live">[Live]</tspan></text>
  <text x="1086" y="366" class="mono tiny">Visible: ON <tspan class="live">[Live]</tspan></text>
  <rect x="1084" y="388" width="286" height="12" fill="#314a32" rx="6"/>
  <rect x="1084" y="388" width="176" height="12" class="accent" rx="6"/>
  <text x="1086" y="422" class="mono tiny">Order = 20 <tspan class="live">[Live]</tspan></text>
  <text x="1086" y="468" class="mono tiny">ApplyResult: foreground.signs.opacity 1.0 -> 0.72 [Applied Live]</text>

  <rect x="1046" y="576" width="366" height="266" class="panel"/>
  <text x="1068" y="610" class="mono title">RENDER STACK / DRAW LAYERS</text>
  <text x="1068" y="640" class="mono small">[LYR] background.city   [order 0][op 100%][Visible]</text>
  <text x="1088" y="664" class="mono tiny">[IMG] Club Backdrop [LayeredImage2D]</text>
  <rect x="1060" y="684" width="330" height="58" class="selected"/>
  <text x="1072" y="708" class="mono small">[LYR] foreground.signs [order 20][op 72%][Visible]</text>
  <text x="1092" y="732" class="mono tiny">[IMG] Club Sign [LayeredImage2D]</text>
  <text x="1068" y="778" class="mono small">[LYR] smoke.near        [order 30][op 55%][Visible]</text>
  <text x="1088" y="802" class="mono tiny">[PAR] Smoke Layer [ParticleEmitter2D]</text>

  <text x="36" y="874" class="mono tiny">Model: Render Stack row click selects Draw Layer or assigned Entity. Inspector changes immediately.</text>
</svg>
